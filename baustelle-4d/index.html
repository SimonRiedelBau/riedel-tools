/* Wochenplan: Bahnen je Kolonne, Karten über die Tage */
function lpsWoche(mon) {
  const days = weekDays(mon), all = lpsK().filter(c => c.week === mon);
  const k = all.filter(c => crewVis(c.crew) && matchQ(c.text, taskMap[c.taskId]?.name, c.crew));
  const active = S.tasks.filter(t => taskSpanInWeek(t, mon) && !taskDone(t));
  const committed = new Set(all.map(c => c.taskId));
  const free = active.filter(t => !committed.has(t.id) && !openCons(t).length);
  const blocked = active.filter(t => !committed.has(t.id) && openCons(t).length);
  const ti = days.indexOf(TODAY), sel = lpsView.sel;
  const card = c => {
    const t = taskMap[c.taskId], oc = t ? openCons(t).length : 0;
    return `<div class="card2 ${c.status} ${sel?.type === 'commit' && sel.id === c.id ? 'sel' : ''}" draggable="true" data-commit="${c.id}" style="grid-column:${c.day + 1} / span ${c.len};--k:${crewCol(c.crew)}" tabindex="0" role="button" aria-label="Zusage ${esc(c.text)}">
      <div class="c-top"><b>${esc(c.text)}</b>${stIcon(c.status)}</div>
      <div class="c-meta">${t && t.name !== c.text ? `<span>${esc(t.name)}</span>` : ''}${c.status === 'nicht' ? `<span class="why">${esc(c.grund || 'ohne Grund')}</span>` : ''}${oc && c.status === 'offen' ? `<span class="cwarn" title="${oc} offene Hindernisse">${ICON.warn}${oc}</span>` : ''}</div></div>`;
  };
  const crews = S.lps.crews.filter(crewVis);
  return `<div class="lps-bar">
      ${free.length ? `<button class="btn small primary-soft" data-lpsact="takefree">${ICON.plus} ${free.length} freie Vorgänge einplanen</button>` : ''}
      ${blocked.length ? `<button class="btn small warn-soft" data-ltab="zeit">${ICON.warn} ${blocked.length} Vorgänge diese Woche blockiert</button>` : ''}
      ${!free.length && !blocked.length ? '<span class="note">Alle Vorgänge dieser Woche sind eingeplant.</span>' : ''}
    </div>
    <div class="tl-wrap"><div class="wgrid" style="--days:5">
      <div class="wh lab">Kolonne</div>
      ${days.map((d, i) => `<div class="wh ${i === ti ? 'today' : ''}"><span>${WD[i]}</span><b class="num">${D.parse(d).getUTCDate()}.</b></div>`).join('')}
      ${crews.length ? crews.map(cr => { const n = k.filter(c => c.crew === cr);
        return `<div class="wl" style="--k:${crewCol(cr)}"><b>${esc(cr)}</b><small class="num">${n.length} Zusagen</small></div>
        <div class="lane" data-crew="${esc(cr)}">
          <div class="cells">${days.map((d, i) => `<button class="cell ${i === ti ? 'today' : ''}" data-cell="${i}" aria-label="Neue Zusage ${esc(cr)} ${WD[i]}">${ICON.plus}</button>`).join('')}</div>
          ${ti >= 0 ? `<i class="nowline" style="left:calc(${(ti + .5) / 5 * 100}%)"></i>` : ''}
          <div class="cards">${n.sort((a, b) => a.day - b.day).map(card).join('')}</div>
        </div>`; }).join('') : '<div class="empty" style="grid-column:1/-1;margin:12px">Alle Kolonnen sind ausgeblendet.</div>'}
    </div></div>
    <p class="note">Zusage anklicken öffnet die Details rechts. Leeres Feld anklicken legt eine neue Zusage an, Karten lassen sich auf andere Tage oder Kolonnen ziehen.</p>`;
}

/* Hindernisliste */
function lpsHind() {
  const f = lpsView.cf, all = lpsC();
  const isOver = c => !c.erledigt && c.bis && c.bis < TODAY;
  const cnt = { offen: all.filter(c => !c.erledigt).length, over: all.filter(isOver).length, done: all.filter(c => c.erledigt).length, alle: all.length };
  const list = all.filter(c => f === 'alle' || (f === 'offen' && !c.erledigt) || (f === 'over' && isOver(c)) || (f === 'done' && c.erledigt))
    .filter(c => { const t = taskMap[c.taskId]; return matchQ(c.text, c.kat, c.wer, t?.name) && (!t || crewVis(taskCrew(t))); })
    .sort((a, b) => (a.erledigt - b.erledigt) || String(a.bis || '9').localeCompare(String(b.bis || '9')));
  return `<div class="lps-bar"><div class="seg">${[['offen', 'Offen'], ['over', 'Überfällig'], ['done', 'Erledigt'], ['alle', 'Alle']].map(([k, l]) => `<button data-cf="${k}" aria-pressed="${f === k}">${l} <span class="num">${cnt[k]}</span></button>`).join('')}</div>
      <span class="note">Neues Hindernis: Vorgang in der Vorschau oder hier in der Liste anklicken.</span></div>
    <div class="tw tblwrap"><table class="tab htab"><thead><tr><th></th><th>Hindernis</th><th>Vorgang</th><th>Zuständig</th><th>Ausräumen bis</th><th>Start Vorgang</th></tr></thead><tbody>
    ${list.length ? list.map(c => { const t = taskMap[c.taskId], buf = t ? D.wdBetween(TODAY, t.start) : null;
      return `<tr class="${c.erledigt ? 'done' : ''} ${isOver(c) ? 'over' : ''}" data-lpstask="${c.taskId}">
        <td><input type="checkbox" data-con="${c.id}" ${c.erledigt ? 'checked' : ''} aria-label="${esc(c.text)} erledigt"></td>
        <td><b>${esc(c.text)}</b><span class="kat">${esc(c.kat)}</span></td>
        <td>${t ? `<span class="tdot" style="background:${crewCol(taskCrew(t))}"></span>${esc(t.name)}` : '–'}</td>
        <td>${esc(c.wer || '–')}</td>
        <td class="num ${isOver(c) ? 'badc' : ''}">${D.de(c.bis)}${isOver(c) ? ' · überfällig' : ''}</td>
        <td class="num">${t ? `${D.short(t.start)}${buf != null && !c.erledigt && t.start >= TODAY ? ` <small class="${buf <= 5 ? 'badc' : 'muted'}">in ${buf} AT</small>` : ''}` : '–'}</td></tr>`; }).join('')
      : `<tr><td colspan="6"><div class="empty">Keine Hindernisse in dieser Auswahl.</div></td></tr>`}
    </tbody></table></div>`;
}

/* Kennzahlen */
function lpsKpi(mon) {
  const weeks = Array.from({ length: 8 }, (_, i) => D.add(mon, (i - 7) * 7));
  const data = weeks.map(w => ({ w, ...ppc(w) }));
  const W = 560, H = 210, pl = 34, pb = 26, pt = 14, pr = 46, bw = (W - pl - pr) / 8;
  const y = v => pt + (1 - v) * (H - pt - pb);
  const bars = data.map((d, i) => { const x = pl + i * bw + bw * .18, w = bw * .64;
    return d.p == null ? `<text x="${x + w / 2}" y="${H - pb - 6}" class="lbl" text-anchor="middle">–</text>`
      : `<rect x="${x}" y="${y(d.p)}" width="${w}" height="${H - pb - y(d.p)}" rx="2" style="fill:var(${d.p >= .8 ? '--st-fertig' : d.p >= .6 ? '--st-arbeit' : '--st-verzug'})"/><text x="${x + w / 2}" y="${y(d.p) - 4}" class="val" text-anchor="middle">${Math.round(d.p * 100)}</text>`; }).join('');
  const xl = data.map((d, i) => `<text x="${pl + i * bw + bw / 2}" y="${H - 8}" class="lbl" text-anchor="middle">KW ${D.kw(d.w)}</text>`).join('');
  const grid = [0, .5, 1].map(v => `<line x1="${pl}" x2="${W - pr + 4}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl - 6}" y="${y(v) + 4}" class="lbl" text-anchor="end">${v * 100}</text>`).join('');
  const inRange = lpsK().filter(c => weeks.includes(c.week));
  const reasons = {}; inRange.filter(c => c.status === 'nicht').forEach(c => reasons[c.grund || 'Sonstiges'] = (reasons[c.grund || 'Sonstiges'] || 0) + 1);
  const rs = Object.entries(reasons).sort((a, b) => b[1] - a[1]), rmax = rs[0]?.[1] || 1;
  const done4 = data.slice(4).filter(d => d.p != null), avg = done4.length ? done4.reduce((a, d) => a + d.p, 0) / done4.length : null;
  const la = lookahead(D.monday(TODAY), 3), laFree = la.length ? la.filter(t => !openCons(t).length).length / la.length : null;
  const oc = lpsC().filter(c => !c.erledigt), late = overdueCons();
  const crewRows = S.lps.crews.map(cr => { const k = inRange.filter(c => c.crew === cr), d = k.filter(c => c.status === 'erledigt').length, n = k.filter(c => c.status === 'nicht').length; return { cr, n: k.length, d, nn: n, p: d + n ? d / (d + n) : null }; }).filter(r => r.n);
  const tile = (l, v, s, cls) => `<div class="tile"><span>${l}</span><strong class="num ${cls || ''}">${v}</strong><small>${s}</small></div>`;
  const last = data[7].p != null ? data[7] : data[6];
  return `<div class="tiles">
      ${tile(last === data[7] ? `PPC KW ${D.kw(mon)}` : 'PPC Vorwoche', pct(last.p), `${last.done} von ${last.done + last.nicht} Zusagen erledigt`, ppcCls(last.p))}
      ${tile('PPC Ø 4 Wochen', pct(avg), 'Ziel ≥ 80 %', ppcCls(avg))}
      ${tile('Vorschau 3 Wochen frei', pct(laFree), `${la.length} Vorgänge betrachtet`)}
      ${tile('Offene Hindernisse', oc.length, `${late.length} überfällig`, late.length ? 'bad' : '')}
    </div>
    <div class="kpi-grid">
      <section class="kcard"><h2>PPC je Woche</h2><div class="tw"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="PPC der letzten 8 Wochen">${grid}<line x1="${pl}" x2="${W - pr + 4}" y1="${y(.8)}" y2="${y(.8)}" class="target"/><text x="${W - 2}" y="${y(.8) + 4}" class="lbl" text-anchor="end">Ziel 80</text>${bars}${xl}</svg></div></section>
      <section class="kcard"><h2>Abweichungsgründe · 8 Wochen</h2>
        ${rs.length ? rs.map(([g, n]) => `<div class="pareto"><span>${esc(g)}</span><div class="bar"><i style="width:${n / rmax * 100}%"></i></div><b class="num">${n}</b></div>`).join('') : '<div class="empty">Keine Abweichungen erfasst.</div>'}</section>
      <section class="kcard full"><h2>PPC je Kolonne · 8 Wochen</h2>
        <div class="tw"><table class="tab"><thead><tr><th>Kolonne / NU</th><th>Zusagen</th><th>erledigt</th><th>nicht</th><th>PPC</th></tr></thead><tbody>
        ${crewRows.map(r => `<tr><td><span class="tdot" style="background:${crewCol(r.cr)}"></span>${esc(r.cr)}</td><td>${r.n}</td><td>${r.d}</td><td>${r.nn}</td><td class="${ppcCls(r.p)}c">${pct(r.p)}</td></tr>`).join('')}</tbody></table></div></section>
    </div>`;
}

/* Detailbereich rechts */
function renderDrawer() {
  const s = lpsView.sel, el = $('#lpsDrawer');
  if (!s) { el.hidden = true; el.innerHTML = ''; $('#lps').classList.remove('withdrawer'); return; }
  el.hidden = false; $('#lps').classList.add('withdrawer');
  el.innerHTML = s.type === 'task' ? drawerTask(taskMap[s.id]) : s.type === 'msel' ? drawerMsel() : drawerCommit(s.draft || lpsK().find(c => c.id === s.id), !!s.draft);
  if (!lpsView.sel) { el.hidden = true; $('#lps').classList.remove('withdrawer'); }
}
function drawerCommit(c, isNew) {
  if (!c) { lpsView.sel = null; return ''; }
  const t = taskMap[c.taskId], oc = t ? openCons(t) : [];
  return `<header class="dh2"><span class="kind" style="--k:${crewCol(c.crew)}">${isNew ? 'Neue Zusage' : 'Zusage'} · KW ${D.kw(c.week)}</span><button class="iconbtn" data-dclose aria-label="Schließen">${ICON.x}</button></header>
  <form class="dform" data-lpsform="commit" data-id="${c.id}">
    <label class="field"><span>Was wird gemacht</span><input id="c-text" name="text" required value="${esc(c.text)}" placeholder="z. B. Wände Achse 1–3 schalen"></label>
    <fieldset class="field"><span>Status</span><div class="seg stseg">${[['offen', 'Zugesagt'], ['erledigt', 'Erledigt'], ['nicht', 'Nicht erledigt']].map(([k, l]) => `<label class="${k}"><input type="radio" name="status" value="${k}" ${c.status === k ? 'checked' : ''}>${stIcon(k)}${l}</label>`).join('')}</div></fieldset>
    <label class="field grund" ${c.status === 'nicht' ? '' : 'hidden'}><span>Grund der Abweichung</span><select id="c-grund" name="grund"><option value="">bitte wählen</option>${LPS_GRUND.map(g => `<option ${c.grund === g ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
    <div class="two"><label class="field"><span>Kolonne / NU</span><select id="c-crew" name="crew">${S.lps.crews.map(x => `<option ${x === c.crew ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
      <label class="field"><span>Vorgang</span><select id="c-task" name="taskId"><option value="">ohne Vorgang</option>${S.tasks.map(x => `<option value="${x.id}" ${c.taskId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label></div>
    <div class="two"><label class="field"><span>Ab</span><select id="c-day" name="day">${WD.map((d, i) => `<option value="${i}" ${c.day === i ? 'selected' : ''}>${d} ${D.short(D.add(c.week, i))}</option>`).join('')}</select></label>
      <label class="field"><span>Dauer</span><select id="c-len" name="len">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${c.len === n ? 'selected' : ''}>${n} ${n > 1 ? 'Tage' : 'Tag'}</option>`).join('')}</select></label></div>
    <label class="field"><span>Notiz</span><textarea id="c-notiz" name="notiz" rows="2">${esc(c.notiz || '')}</textarea></label>
    ${oc.length ? `<div class="dwarn">${ICON.warn}<div><b>${oc.length} offene Hindernisse am Vorgang</b>${oc.map(x => `<small>${esc(x.kat)}: ${esc(x.text)}</small>`).join('')}</div></div>` : ''}
    <p class="note" id="c-msg"></p>
    <div class="dact">${isNew ? '' : `<button class="btn" type="button" data-lpsdel="${c.id}">Löschen</button>`}<span class="sp"></span>${t ? `<button class="btn" type="button" data-show3d="${t.id}">Im Modell</button>` : ''}<button class="btn primary" type="submit">Speichern</button></div>
  </form>`;
}
function lpsChanged() { save(); renderLps(); }
function newCommit(crew, day, taskId) {
  const t = taskMap[taskId], sp = t ? taskSpanInWeek(t, lpsView.week) : null;
  lpsView.sel = { type: 'commit', id: 'new', draft: { id: uid(), week: lpsView.week, taskId: taskId || '', text: t ? t.name : '', crew: crew || (t ? crewFor(t) : S.lps.crews[0]), day: sp ? sp.day : day || 0, len: sp ? sp.len : 1, status: 'offen', grund: '', notiz: '' } };
  if (lpsView.tab !== 'woche') lpsView.tab = 'woche';
  renderLps(); setTimeout(() => $('#c-text')?.focus(), 0);
}

$('#lps').addEventListener('click', e => {
  const t = e.target;
  const lt = t.closest('[data-ltab]'); if (lt) { lpsView.tab = lt.dataset.ltab; return renderLps(); }
  const wk = t.closest('[data-wk]'); if (wk) { const n = +wk.dataset.wk; lpsView.week = n ? D.add(lpsView.week, 7 * n) : D.monday(TODAY); if (lpsView.sel?.draft) lpsView.sel = null; return renderLps(); }
  if (t.closest('[data-dclose]')) { lpsView.sel = null; return renderLps(); }
  if (t.closest('[data-newcommit]')) return newCommit();
  const ct = t.closest('[data-crewtoggle]'); if (ct) { const c = ct.dataset.crewtoggle; lpsView.hide.has(c) ? lpsView.hide.delete(c) : lpsView.hide.add(c); return renderLps(); }
  const cf = t.closest('[data-cf]'); if (cf) { lpsView.cf = cf.dataset.cf; return renderLps(); }
  const gt = t.closest('[data-gtoggle]'); if (gt) { const g = gt.dataset.gtoggle; lpsView.collapsed.has(g) ? lpsView.collapsed.delete(g) : lpsView.collapsed.add(g); return renderLps(); }
  const nt = t.closest('[data-commit]'); if (nt) { lpsView.sel = { type: 'commit', id: nt.dataset.commit }; return renderLps(); }
  const cell = t.closest('[data-cell]'); if (cell) return newCommit(cell.closest('[data-crew]').dataset.crew, +cell.dataset.cell);
  if (t.closest('[data-lpsact="takefree"]')) {
    const mon = lpsView.week, have = new Set(lpsK().filter(c => c.week === mon).map(c => c.taskId));
    const free = S.tasks.filter(x => taskSpanInWeek(x, mon) && !taskDone(x) && !have.has(x.id) && !openCons(x).length);
    free.forEach(x => { const sp = taskSpanInWeek(x, mon); const crew = crewFor(x); if (!S.lps.crews.includes(crew)) S.lps.crews.push(crew); lpsK().push({ id: uid(), week: mon, taskId: x.id, text: x.name, crew, day: sp.day, len: sp.len, status: 'offen', grund: '', notiz: '' }); });
    toast(`${free.length} Vorgänge als Zusage eingeplant.`); return lpsChanged();
  }
  const pt = t.closest('[data-plantask]'); if (pt) return newCommit(null, 0, pt.dataset.plantask);
  const cd = t.closest('[data-condel]'); if (cd) { e.preventDefault(); S.lps.constraints = lpsC().filter(c => c.id !== cd.dataset.condel); return lpsChanged(); }
  const del = t.closest('[data-lpsdel]'); if (del) { S.lps.commits = lpsK().filter(c => c.id !== del.dataset.lpsdel); lpsView.sel = null; toast('Zusage gelöscht.'); return lpsChanged(); }
  const s3 = t.closest('[data-show3d]'); if (s3) return show3d(s3.dataset.show3d);
  if (t.closest('input,label.con2,select,textarea')) return;
  const lt2 = t.closest('[data-lpstask]'); if (lt2) { lpsView.sel = { type: 'task', id: lt2.dataset.lpstask }; return renderLps(); }
});
$('#lps').addEventListener('change', e => {
  const tg = e.target;
  if (tg.name === 'status' && tg.closest('[data-lpsform=commit]')) { tg.closest('form').querySelector('.grund').hidden = tg.value !== 'nicht'; return; }
  const c = tg.dataset.con; if (!c) return;
  const x = lpsC().find(k => k.id === c); x.erledigt = tg.checked;
  const t = taskMap[x.taskId];
  if (x.erledigt && t && !openCons(t).length) toast(`„${t.name}“ ist jetzt frei für den Wochenplan.`);
  lpsChanged();
});
$('#lps').addEventListener('input', e => { if (e.target.id === 'lps-q') { lpsView.q = e.target.value.trim().toLowerCase(); clearTimeout(lpsView.qt); lpsView.qt = setTimeout(() => { $('#lpsBody').innerHTML = { woche: lpsWoche, zeit: lpsZeit, hind: lpsHind, kpi: lpsKpi }[lpsView.tab](lpsView.week); }, 150); } });
$('#lps').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.commit) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && lpsView.sel) { lpsView.sel = null; renderLps(); }
});
$('#lps').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, fd = new FormData(f);
  if (f.dataset.lpsform === 'crew') { const n = String(fd.get('crew') || '').trim(); if (n && !S.lps.crews.includes(n)) { S.lps.crews.push(n); lpsChanged(); } return; }
  if (f.dataset.lpsform === 'commit') {
    const status = fd.get('status') || 'offen', grund = fd.get('grund') || '';
    if (status === 'nicht' && !grund) { const m = $('#c-msg'); m.textContent = 'Bitte einen Grund wählen – daraus entsteht die Auswertung der Abweichungen.'; m.className = 'note badc'; return; }
    let c = lpsK().find(k => k.id === f.dataset.id);
    if (!c) { c = lpsView.sel.draft; lpsK().push(c); }
    const day = +fd.get('day');
    Object.assign(c, { text: String(fd.get('text')).trim(), crew: fd.get('crew'), taskId: fd.get('taskId') || '', day, len: Math.min(+fd.get('len'), 5 - day), status, grund: status === 'nicht' ? grund : '', notiz: String(fd.get('notiz') || '').trim() });
    lpsView.sel = { type: 'commit', id: c.id };
    toast('Zusage gespeichert.');
    if (c.taskId && openCons(taskMap[c.taskId]).length && status === 'offen') toast('Gespeichert. Achtung: Der Vorgang hat noch offene Hindernisse.', 3500);
    return lpsChanged();
  }
  if (f.dataset.lpsform === 'con') {
    lpsC().push({ id: uid(), taskId: f.dataset.task, kat: fd.get('kat'), text: String(fd.get('text')).trim(), wer: String(fd.get('wer') || '').trim(), bis: fd.get('bis') || null, erledigt: false });
    toast('Hindernis angelegt.'); return lpsChanged();
  }
});
$('#lps').addEventListener('dragstart', e => { const n = e.target.closest?.('[data-commit]'); if (!n) return; lpsView.drag = n.dataset.commit; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', n.dataset.commit); n.classList.add('dragging'); });
$('#lps').addEventListener('dragover', e => { const l = e.target.closest('.lane'); if (lpsView.drag && l) { e.preventDefault(); document.querySelectorAll('.lane.over').forEach(x => x !== l && x.classList.remove('over')); l.classList.add('over'); } });
$('#lps').addEventListener('drop', e => {
  const lane = e.target.closest('.lane'); if (!lane || !lpsView.drag) return; e.preventDefault();
  const c = lpsK().find(k => k.id === lpsView.drag); lpsView.drag = null; if (!c) return;
  const r = lane.getBoundingClientRect(), day = Math.max(0, Math.min(4, Math.floor((e.clientX - r.left) / r.width * 5)));
  c.crew = lane.dataset.crew; c.day = Math.min(day, 5 - c.len); lpsChanged();
});
$('#lps').addEventListener('dragend', () => { lpsView.drag = null; document.querySelectorAll('.lane.over,.dragging').forEach(x => x.classList.remove('over', 'dragging')); });
function show3d(taskId) {
  if (lpsView.split) { lpsView.sel = { type: 'task', id: taskId }; renderLps(); applyColors(); const g0 = elsArr().find(x => x.taskId === taskId); if (g0) flyTo(g0.guid); else toast('Dieser Vorgang hat keine Bauteile im Modell.'); return; }
  setLps(false);
  view.selTask = taskId; view.sel = new Set(elsArr().filter(x => x.taskId === taskId).map(x => x.guid));
  view.tab = 'termine'; applyColors(); renderPanel();
  const g = [...view.sel][0]; if (g) flyTo(g); else toast('Dieser Vorgang hat keine Bauteile im Modell.');
}

/* Vorschau: Balkenplan der nächsten 6 Wochen, gruppiert nach Abschnitt – Balken und Abschnitte verschiebbar */
function lpsZeit(mon) {
  const W = 6, days = []; for (let w = 0; w < W; w++) weekDays(D.add(mon, w * 7)).forEach(d => days.push(d));
  const N = days.length, end = days[N - 1];

  const groups = []; list.forEach(t => { const g = t.storey || 'Ohne Abschnitt'; let G = groups.find(x => x.k === g); if (!G) groups.push(G = { k: g, ts: [] }); G.ts.push(t); });

  };
  return `<div class="lps-bar"><span class="note">${list.length} Vorgänge · <b class="okc">${list.filter(t => !openCons(t).length).length} frei</b> · <b class="badc">${list.filter(t => openCons(t).length).length} mit offenen Hindernissen</b>. Balken ziehen verschiebt, rechter Rand ändert die Dauer, der dunkle Abschnittsbalken verschiebt den ganzen Bereich.</span></div>

    <div class="gh lab">Vorgang</div>

    ${groups.map(G => { const c = lpsView.collapsed.has(G.k);
      const gs = G.ts.map(t => t.start).sort()[0], ge = G.ts.map(t => t.end).sort().pop();

      ${c ? '' : G.ts.map(t => { const oc = openCons(t).length;

/* Rückgängig für Verschieben und Zuordnen */
function planSnap() { return { tasks: structuredClone(S.tasks), el: Object.fromEntries(elsArr().map(e => [e.guid, e.taskId])) }; }
function pushUndo() { lpsView.undo.push(planSnap()); if (lpsView.undo.length > 30) lpsView.undo.shift(); }
function lpsUndo() {
  const u = lpsView.undo.pop(); if (!u) return;
  S.tasks = u.tasks; for (const e of elsArr()) e.taskId = u.el[e.guid] ?? null;
  afterPlanChange(); toast('Rückgängig gemacht.');
}
function afterPlanChange() { reindex(); computeRange(); renderTicks(); save(); renderLps(); applyColors(); }

/* Balken ziehen */
let gdrag = null;
$('#lps').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-drag]'); if (!b || e.button !== 0) return;
  const lane = b.closest('.gbars'); if (!lane) return;
  const r = b.getBoundingClientRect(), dayW = lane.getBoundingClientRect().width / +getComputedStyle(lane).getPropertyValue('--n');
  gdrag = { el: b, kind: b.dataset.drag, id: b.dataset.lpstask || b.dataset.group, x0: e.clientX, dayW, mode: b.dataset.drag === 'task' && e.clientX > r.right - 10 ? 'dur' : 'move', dd: 0, w0: r.width };
  b.setPointerCapture(e.pointerId); b.classList.add('dragging'); e.preventDefault();
});
$('#lps').addEventListener('pointermove', e => {
  if (!gdrag) { const b = e.target.closest('[data-drag="task"]'); if (b) b.style.cursor = e.clientX > b.getBoundingClientRect().right - 10 ? 'ew-resize' : 'grab'; return; }
  const dd = Math.round((e.clientX - gdrag.x0) / gdrag.dayW); if (dd === gdrag.dd) return; gdrag.dd = dd;
  if (gdrag.mode === 'dur') gdrag.el.style.width = Math.max(gdrag.dayW * .8, gdrag.w0 + dd * gdrag.dayW) + 'px';
  else gdrag.el.style.transform = `translateX(${dd * gdrag.dayW}px)`;
  let tip = '';
  if (gdrag.kind === 'task') { const t = taskMap[gdrag.id]; tip = gdrag.mode === 'dur' ? `${Math.max(1, t.dur + dd)} AT` : `${D.short(D.addWD(t.start, dd))} – ${D.short(D.addWD(t.end, dd))}`; }
  else tip = `${dd > 0 ? '+' : ''}${dd} AT`;
  gdrag.el.dataset.tip = tip;
});
function endDrag(e) {
  if (!gdrag) return; const g = gdrag; gdrag = null;
  g.el.classList.remove('dragging');
  if (!g.dd) { g.el.style.transform = ''; g.el.style.width = ''; delete g.el.dataset.tip; if (g.kind === 'task') { lpsView.sel = { type: 'task', id: g.id }; renderLps(); applyColors(); } return; }
  lpsView.noClick = true; setTimeout(() => lpsView.noClick = false, 0);
  pushUndo();
  const blocked = [];
  const moveTask = (t, dd) => { const want = D.addWD(t.start, dd); t.fix = want; return want; };
  if (g.kind === 'task') {
    const t = taskMap[g.id];
    if (g.mode === 'dur') { t.dur = Math.max(1, t.dur + g.dd); reindex(); toast(`„${t.name}“: ${t.dur} AT, Ende ${D.de(t.end)}.`); }
    else { const want = moveTask(t, g.dd); reindex(); if (taskMap[g.id].start !== want) blocked.push(taskMap[g.id]); else toast(`„${t.name}“ beginnt jetzt am ${D.de(want)}.`); }
  } else {
    const ts = S.tasks.filter(t => (t.storey || 'Ohne Abschnitt') === g.id && !taskDone(t));
    const wants = ts.map(t => [t.id, moveTask(t, g.dd)]);
    reindex();
    wants.forEach(([id, w]) => { if (taskMap[id].start !== w && taskMap[id].start > w) blocked.push(taskMap[id]); });
    if (!blocked.length) toast(`Abschnitt ${g.id}: ${ts.length} Vorgänge um ${g.dd > 0 ? '+' : ''}${g.dd} AT verschoben.`);
  }
  if (blocked.length) {
    const t = blocked[0], pr = (t.preds || []).map(p => taskMap[p.id]?.name).filter(Boolean);
    toast(`„${t.name}“ kann frühestens am ${D.de(t.start)} beginnen${pr.length ? ` – Vorgänger: ${pr.join(', ')}` : ''}. Abhängigkeit im Detailbereich lösen, falls parallel gearbeitet werden kann.`, 6500);
    if (g.kind === 'task') lpsView.sel = { type: 'task', id: t.id };
  }
  afterPlanChange();
}
$('#lps').addEventListener('pointerup', endDrag);
$('#lps').addEventListener('pointercancel', endDrag);
$('#lps').addEventListener('click', e => { if (lpsView.noClick) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);

/* 3D-Modell neben dem Plan */
function lpsSplit(on) {
  lpsView.split = on;
  const cv = renderer.domElement;
  if (on) { $('#lps3dVp').append(cv); } else { host.prepend(cv); lpsView.assign = null; lpsView.msel.clear(); }
  $('#lps').classList.toggle('split', on);
  $('#lps3d').hidden = !on;

  requestAnimationFrame(() => { resize(); if (on) frame(); });
}
function lps3dControls() {
  if (!lpsView.open || !lpsView.split) { orbit.mouseButtons.RIGHT = THREE.MOUSE.PAN; setTool(view.tool === 'walk' ? 'select' : view.tool); return; }
  orbit.enabled = true;
  const a = !!lpsView.assign;
  orbit.mouseButtons.LEFT = a ? -1 : THREE.MOUSE.ROTATE;
  orbit.mouseButtons.RIGHT = a ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;

    : 'Bauteil anklicken zeigt seinen Vorgang. Mit Shift mehrere Bauteile wählen – daraus einen Vorgang anlegen oder zuordnen.';
  $('#lps3d').classList.toggle('assigning', a);
}
let mdown = null, mpaint = null;
function lps3dKeyFn() {
  const cache = new Map(), at = lpsView.assign;
  return e => {
    if (at) return e.taskId === at ? 'k' + (crewIdx(taskCrew(taskMap[at])) % 8) : e.taskId ? 'beton' : 'ghost';
    const t = taskMap[e.taskId]; if (!t) return 'ghost';
    if (istAt(e, view.date) >= 2) return 'beton';
    if (!cache.has(t.id)) cache.set(t.id, 'k' + (crewIdx(taskCrew(t)) % 8));
    return cache.get(t.id);
  };
}
function lpsSelSet() {
  const s = new Set(lpsView.msel), id = lpsView.assign || (lpsView.sel?.type === 'task' ? lpsView.sel.id : null);
  if (id && !lpsView.assign) for (const e of elsArr()) if (e.taskId === id) s.add(e.guid);
  return s;
}
function lpsPD(ev) {
  if (!lpsView.split) return;
  mdown = { x: ev.clientX, y: ev.clientY, shift: ev.shiftKey || ev.ctrlKey || ev.metaKey };
  if (lpsView.assign && ev.button === 0) {
    const g = pick(ev); const e = g && S.elements[g];
    mpaint = { add: !(e && e.taskId === lpsView.assign), done: new Set(), changed: 0 };
    pushUndo(); assignAt(ev);
  }
}
function assignAt(ev) {
  const g = pick(ev); if (!g || mpaint.done.has(g)) return;
  const e = S.elements[g]; if (!e || e.cat === 'Aushub' && false) return;
  mpaint.done.add(g);
  const want = mpaint.add ? lpsView.assign : null;
  if (e.taskId !== want) { e.taskId = want; mpaint.changed++; applyColors(); }
}
function lpsPM(ev) { if (mpaint) assignAt(ev); }
function lpsPU(ev) {
  if (mpaint) { const m = mpaint; mpaint = null; mdown = null; if (m.changed) { toast(`${m.changed} Bauteil${m.changed > 1 ? 'e' : ''} ${m.add ? 'zugeordnet' : 'herausgenommen'}.`); afterPlanChange(); } else lpsView.undo.pop(); return; }
  if (!mdown || ev.target !== renderer.domElement) { mdown = null; return; }
  const moved = Math.hypot(ev.clientX - mdown.x, ev.clientY - mdown.y) > 5, sh = mdown.shift; mdown = null;
  if (moved || ev.button !== 0) return;
  const g = pick(ev), e = g && S.elements[g];
  if (sh) { if (g) lpsView.msel.has(g) ? lpsView.msel.delete(g) : lpsView.msel.add(g); lpsView.sel = lpsView.msel.size ? { type: 'msel' } : null; }
  else if (!e) { lpsView.msel.clear(); lpsView.sel = null; }
  else if (e.taskId && taskMap[e.taskId]) { lpsView.msel.clear(); lpsView.sel = { type: 'task', id: e.taskId }; revealTask(e.taskId); }
  else { lpsView.msel = new Set([g]); lpsView.sel = { type: 'msel' }; }

/* ---------- Gemeinsamer Speicher (Riedel-Tools / Supabase) ----------
   Läuft nur, wenn die Seite in den Riedel-Tools mit Anmeldung geöffnet ist (assets/auth-gate.js).
   Tabellen b4d_projekte und b4d_daten, Bucket baustelle-4d – siehe baustelle-4d/supabase-setup.sql.
   Jeder Datensatz (Ablauf, Bauteilstatus, Zusage, Hindernis, Mangel, Tagebucheintrag) ist eine eigene
   Zeile. Gespeichert wird nur, was sich geändert hat; andere Geräte bekommen Änderungen live. */
const T_PROJ = 'b4d_projekte', T_DAT = 'b4d_daten', BUCKET = 'baustelle-4d', LAST_PROJ = 'baustelle4d.projekt';
const CL = { sb: null, ready: false, setup: false, on: false, me: null, mail: '', cid: uid() + uid(), proj: null, snap: new Map(), planVer: 0,
  chan: null, busy: false, again: false, state: 'ok', at: null, online: 1, timer: null, retry: null, urls: new Map(), applyT: null };
const dbMissing = e => e && (e.code === '42P01' || e.code === 'PGRST205' || /does not exist|schema cache|could not find the table/i.test(e.message || ''));
const isLocalFoto = f => typeof f === 'string' && f.startsWith('data:');

function records(st = S) {
  const m = new Map();
  m.set('plan|plan', JSON.stringify({ project: st.project, projectStart: st.projectStart, tasks: st.tasks, vergaben: st.vergaben, milestones: st.milestones, crews: st.lps?.crews || [],
    elTask: Object.fromEntries(Object.values(st.elements).filter(e => e.taskId).map(e => [e.guid, e.taskId])) }));
  for (const e of Object.values(st.elements)) if (e.startDate || e.doneDate || e.acceptDate) m.set('bauteil|' + e.guid, JSON.stringify({ s: e.startDate, d: e.doneDate, a: e.acceptDate }));
  for (const c of st.lps?.commits || []) m.set('zusage|' + c.id, JSON.stringify(c));
  for (const c of st.lps?.constraints || []) m.set('hindernis|' + c.id, JSON.stringify(c));
  for (const x of st.maengel) m.set('mangel|' + x.id, JSON.stringify(x));
  for (const x of st.tagebuch) m.set('tagebuch|' + x.id, JSON.stringify(x));
  return m;
}
const splitKey = k => { const i = k.indexOf('|'); return [k.slice(0, i), k.slice(i + 1)]; };
function putById(list, id, d) { const i = list.findIndex(x => x.id === id); if (!d) { if (i >= 0) list.splice(i, 1); } else if (i >= 0) list[i] = d; else list.push(d); }
function applyRec(art, id, d, del) {
  switch (art) {
    case 'plan':
      if (del || !d) return;
      S.project = { ...S.project, ...(d.project || {}) }; if (d.projectStart) S.projectStart = d.projectStart;
      if (Array.isArray(d.tasks)) S.tasks = d.tasks; if (Array.isArray(d.vergaben)) S.vergaben = d.vergaben; if (Array.isArray(d.milestones)) S.milestones = d.milestones;
      if (Array.isArray(d.crews)) S.lps.crews = d.crews;
      if (d.elTask) for (const e of Object.values(S.elements)) e.taskId = d.elTask[e.guid] ?? null;
      return;
    case 'bauteil': { const e = S.elements[id]; if (!e) return; e.startDate = del ? null : d.s || null; e.doneDate = del ? null : d.d || null; e.acceptDate = del ? null : d.a || null; return; }
    case 'zusage': return putById(S.lps.commits, id, del ? null : d);
    case 'hindernis': return putById(S.lps.constraints, id, del ? null : d);
    case 'mangel': return putById(S.maengel, id, del ? null : d);
    case 'tagebuch': return putById(S.tagebuch, id, del ? null : d);
  }
}

/* Status in der Kopfzeile */
function srcLabel() {
  if (S.source === 'demo') return CL.ready ? 'Beispieldaten · nur in diesem Browser' : 'Beispieldaten';
  if (S.source !== 'cloud') return `IFC · ${S.file || ''}${CL.ready ? ' · nur in diesem Browser' : ''}`;
  const who = CL.online > 1 ? ` · ${CL.online} online` : '';
  return { ok: `Gemeinsam gespeichert${CL.at ? ' ' + CL.at.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : ''}${who}`,
    busy: 'Wird gespeichert …', err: 'Offline – Änderungen werden nachgeholt', setup: 'Speicher nicht eingerichtet' }[CL.state] || '';
}
function setSync(state) {
  CL.state = state; const el = $('#projSrc'); if (!el) return;
  el.textContent = srcLabel(); el.dataset.sync = S.source === 'cloud' ? state : '';
}

/* Lokale Kopie je Projekt: Arbeiten ohne Netz, Nachholen beim nächsten Start */
const cacheKey = id => STORE + '.cloud.' + id;
function saveCloudLocal() {
  try { localStorage.setItem(cacheKey(CL.proj.id), JSON.stringify({ S: { ...S, elements: Object.fromEntries(Object.values(S.elements).filter(e => e.startDate || e.doneDate || e.acceptDate || e.taskId).map(e => [e.guid, { taskId: e.taskId, startDate: e.startDate, doneDate: e.doneDate, acceptDate: e.acceptDate }])) }, snap: Object.fromEntries(CL.snap), planVer: CL.planVer })); }
  catch { /* Speicher voll: Stand liegt trotzdem in der Datenbank, sobald online */ }
}
function cloudSaveLater() {
  saveCloudLocal();
  clearTimeout(CL.timer); CL.timer = setTimeout(cloudPush, 500);
  if (CL.state !== 'busy') setSync('busy');
}

async function uploadFotos() {
  for (const t of S.tagebuch) {
    if (!t.fotos?.some(isLocalFoto)) continue;
    const out = [];
    for (const f of t.fotos) {
      if (!isLocalFoto(f)) { out.push(f); continue; }
      const blob = await (await fetch(f)).blob(), pfad = `${CL.proj.id}/fotos/${uid()}${uid()}.jpg`;
      const r = await CL.sb.storage.from(BUCKET).upload(pfad, blob, { contentType: 'image/jpeg', upsert: false });
      if (r.error) throw r.error;
      CL.urls.set(pfad, f); out.push({ pfad });
    }
    t.fotos = out;
  }
}
async function cloudPush() {
  if (!CL.on) return;
  if (CL.busy) { CL.again = true; return; }
  CL.busy = true; clearTimeout(CL.retry);
  const projekt = CL.proj.id;
  try {
    await uploadFotos();
    const cur = records(), ups = [], dels = [];
    for (const [k, v] of cur) if (CL.snap.get(k) !== v) ups.push([k, v]);
    for (const k of CL.snap.keys()) if (!cur.has(k)) dels.push(k);
    const planV = cur.get('plan|plan');
    if (CL.snap.get('plan|plan') !== planV) {
      const daten = JSON.parse(planV);
      const q = CL.planVer === 0
        ? CL.sb.from(T_DAT).upsert({ projekt, art: 'plan', id: 'plan', daten, version: 1, client: CL.cid, geloescht: false }, { onConflict: 'projekt,art,id', ignoreDuplicates: true }).select('version')
        : CL.sb.from(T_DAT).update({ daten, version: CL.planVer + 1, client: CL.cid }).eq('projekt', projekt).eq('art', 'plan').eq('id', 'plan').eq('version', CL.planVer).select('version');
      const r = await q;
      if (r.error) throw r.error;
      if (!r.data?.length) {
        // Ein anderer hat den Ablauf zwischenzeitlich geändert: dessen Stand gilt
        const row = (await CL.sb.from(T_DAT).select('daten,version,geaendert_mail').eq('projekt', projekt).eq('art', 'plan').eq('id', 'plan').single()).data;
        if (row) { applyRec('plan', 'plan', row.daten, false); reindex(); CL.planVer = row.version; CL.snap.set('plan|plan', records().get('plan|plan')); queueRender();
          toast(`Den Ablauf hat gerade ${row.geaendert_mail || 'jemand anderes'} geändert. Du siehst jetzt diesen Stand – deine letzte Ablaufänderung bitte noch einmal eintragen.`, 7000); }
      } else { CL.planVer = r.data[0].version; CL.snap.set('plan|plan', planV); }
    }
    const rows = ups.filter(([k]) => k !== 'plan|plan').map(([k, v]) => { const [art, id] = splitKey(k); return { projekt, art, id, daten: JSON.parse(v), geloescht: false, client: CL.cid }; })
      .concat(dels.filter(k => k !== 'plan|plan').map(k => { const [art, id] = splitKey(k); return { projekt, art, id, daten: {}, geloescht: true, client: CL.cid }; }));
    for (let i = 0; i < rows.length; i += 400) {
      const part = rows.slice(i, i + 400);
      const r = await CL.sb.from(T_DAT).upsert(part, { onConflict: 'projekt,art,id' });
      if (r.error) throw r.error;
      for (const x of part) { const k = x.art + '|' + x.id; if (x.geloescht) CL.snap.delete(k); else CL.snap.set(k, cur.get(k)); }
    }
    CL.at = new Date(); setSync('ok');
  } catch (e) {
    console.warn('Sync', e);
    if (dbMissing(e)) setSync('setup');
    else { setSync('err'); CL.retry = setTimeout(cloudPush, 20000); }
  } finally {
    CL.busy = false; if (CL.on) saveCloudLocal();
    if (CL.again) { CL.again = false; cloudPush(); }
  }
}
addEventListener('online', () => { if (CL.on) cloudPush(); });

/* Live-Änderungen anderer */
let renderQ = null;
function queueRender() { clearTimeout(renderQ); renderQ = setTimeout(() => { reindex(); computeRange(); renderAll(); renderTicks(); }, 120); }
function onRemote(row) {
  if (!row || row.projekt !== CL.proj?.id || row.client === CL.cid) return;
  const k = row.art + '|' + row.id;
  if (row.art === 'plan') { if (row.version <= CL.planVer) return; CL.planVer = row.version; }
  applyRec(row.art, row.id, row.daten, row.geloescht);
  if (row.art === 'plan') reindex();
  const v = records().get(k);
  if (v == null) CL.snap.delete(k); else CL.snap.set(k, v);
  saveCloudLocal(); queueRender();
}
function subscribe() {
  unsubscribe();
  const id = CL.proj.id;
  const ch = CL.chan = CL.sb.channel('b4d-' + id, { config: { presence: { key: CL.cid } } });
  ch.on('postgres_changes', { event: '*', schema: 'public', table: T_DAT, filter: 'projekt=eq.' + id }, ev => onRemote(ev.new))
    .on('presence', { event: 'sync' }, () => { CL.online = Object.keys(ch.presenceState()).length || 1; setSync(CL.state); })
    .subscribe(st => { if (st === 'SUBSCRIBED') ch.track({ mail: CL.mail }); });
}
function unsubscribe() { if (CL.chan) { CL.sb.removeChannel(CL.chan); CL.chan = null; } CL.online = 1; }

/* IFC-Zwischenspeicher im Browser, damit das Modell nicht bei jedem Öffnen neu geladen wird */
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('baustelle4d', 1); r.onupgradeneeded = () => r.result.createObjectStore('ifc'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function idbGet(k) { try { const db = await idb(); return await new Promise(ok => { const q = db.transaction('ifc').objectStore('ifc').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } }
async function idbPut(k, v) { try { const db = await idb(); db.transaction('ifc', 'readwrite').objectStore('ifc').put(v, k); } catch { /* ohne Zwischenspeicher geht es auch */ } }

async function cloudOpen(row) {
  stopPlay(); cloudLeave(true);
  try {
    if (!row.ifc_pfad) throw new Error('Zu diesem Projekt ist kein IFC-Modell hinterlegt.');
    $('#busy').hidden = false; $('#busy').textContent = `${row.name} wird geladen …`;
    let buf = await idbGet(row.ifc_pfad);
    if (!buf) {
      $('#busy').textContent = `IFC-Modell wird heruntergeladen (${fmtN((row.ifc_groesse || 0) / 1048576, 1)} MB) …`;
      const dl = await CL.sb.storage.from(BUCKET).download(row.ifc_pfad);
      if (dl.error) throw dl.error;
      buf = await dl.data.arrayBuffer(); idbPut(row.ifc_pfad, buf);
    }
    const { elements, geoms, order } = await parseIFC(buf, row.ifc_name || 'Modell.ifc');
    $('#busy').hidden = false; $('#busy').textContent = 'Projektdaten werden geladen …';
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const r = await CL.sb.from(T_DAT).select('art,id,daten,geloescht,version').eq('projekt', row.id).range(from, from + 999);
      if (r.error) throw r.error; rows.push(...r.data); if (r.data.length < 1000) break;
    }
    S = autoPlan(elements, order, row.ifc_name || row.name);
    S.source = 'cloud'; S.project.name = row.name; S.lps ||= { crews: ['Kolonne 1', 'Kolonne 2', 'NU Erdbau', 'NU Bewehrung'], commits: [], constraints: [] };
    const remote = new Set();
    CL.proj = row; CL.planVer = 0;
    for (const x of rows) { if (x.art === 'plan') CL.planVer = x.version; if (!x.geloescht) { applyRec(x.art, x.id, x.daten, false); remote.add(x.art + '|' + x.id); } }
    reindex();
    CL.snap = new Map([...records()].filter(([k]) => remote.has(k)));
    if (!remote.has('plan|plan')) CL.planVer = 0;
    // Änderungen, die in diesem Browser noch nicht hochgeladen waren
    let pending = 0;
    try {
      const c = JSON.parse(localStorage.getItem(cacheKey(row.id)) || 'null');
      if (c?.S) {
        const loc = { ...c.S, elements: Object.fromEntries(Object.entries(S.elements).map(([g, e]) => [g, { ...e, taskId: null, startDate: null, doneDate: null, acceptDate: null, ...(c.S.elements[g] || {}) }])) };
        const lr = records(loc), ls = new Map(Object.entries(c.snap || {}));
        for (const [k, v] of lr) if (ls.get(k) !== v && k !== 'plan|plan') { const [a, id] = splitKey(k); applyRec(a, id, JSON.parse(v), false); pending++; }
        for (const k of ls.keys()) if (!lr.has(k) && k !== 'plan|plan') { const [a, id] = splitKey(k); applyRec(a, id, null, true); pending++; }
        if (lr.get('plan|plan') !== ls.get('plan|plan') && (c.planVer || 0) === CL.planVer) { applyRec('plan', 'plan', JSON.parse(lr.get('plan|plan')), false); pending++; }
      }
    } catch { /* kaputte lokale Kopie ignorieren */ }
    CL.on = true; lastIfcFile = null;
    try { localStorage.setItem(LAST_PROJ, row.id); } catch { }
    reindex(); showModel(geoms); afterModelChange(); frame();
    subscribe(); CL.at = new Date(); setSync('ok');
    cloudPush();
    toast(pending ? `${row.name} geladen. ${pending} Änderungen aus diesem Browser werden nachgetragen.` : `${row.name} geladen – gemeinsamer Stand.`, 4000);
  } catch (e) {
    console.error(e); CL.on = false;
    toast((dbMissing(e) ? 'Der gemeinsame Speicher ist noch nicht eingerichtet. ' : 'Projekt konnte nicht geladen werden: ') + (e.message || e), 7000);
    if (S?.source === 'cloud') startDemo();
  } finally { $('#busy').hidden = true; }
}
function cloudLeave(keep) {
  if (!CL.on) return;
  clearTimeout(CL.timer); if (CL.proj) saveCloudLocal();
  CL.on = false; unsubscribe(); if (!keep) CL.proj = null;
  if (!keep) try { localStorage.removeItem(LAST_PROJ); } catch { }
}

const slug = s => (s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'projekt');
async function cloudCreate(name) {
  const file = lastIfcFile;
  if (!file) throw new Error('Bitte zuerst die IFC-Datei laden.');
  if (file.size > 50 * 1048576) throw new Error('Die IFC-Datei ist größer als 50 MB. Bitte reduziertes Modell (nur Tragwerk) exportieren.');
  const id = slug(name) + '-' + uid().slice(0, 4), pfad = `${id}/modell/${slug(file.name.replace(/\.ifc$/i, ''))}.ifc`;
  $('#busy').hidden = false; $('#busy').textContent = 'IFC-Modell wird hochgeladen …';
  try {
    const up = await CL.sb.storage.from(BUCKET).upload(pfad, file, { contentType: 'application/octet-stream', upsert: true });
    if (up.error) throw up.error;
    const r = await CL.sb.from(T_PROJ).insert({ id, name, ifc_pfad: pfad, ifc_name: file.name, ifc_groesse: file.size }).select().single();
    if (r.error) throw r.error;
    idbPut(pfad, await file.arrayBuffer());
    S.source = 'cloud'; S.project.name = name; CL.proj = r.data; CL.snap = new Map(); CL.planVer = 0; CL.on = true; lastIfcFile = null;
    try { localStorage.setItem(LAST_PROJ, id); } catch { }
    subscribe(); renderHeader(); await cloudPush();
    toast(`„${name}“ ist jetzt gemeinsam gespeichert. Alle Freigeschalteten finden es unter „Projekte“.`, 5000);
  } finally { $('#busy').hidden = true; }
}
async function cloudNewModel(file) {
  if (file.size > 50 * 1048576) throw new Error('Die IFC-Datei ist größer als 50 MB.');
  const pfad = `${CL.proj.id}/modell/${slug(file.name.replace(/\.ifc$/i, ''))}-${uid().slice(0, 4)}.ifc`;
  $('#busy').hidden = false; $('#busy').textContent = 'Neue Modellversion wird hochgeladen …';
  try {
    const up = await CL.sb.storage.from(BUCKET).upload(pfad, file, { contentType: 'application/octet-stream', upsert: true });
    if (up.error) throw up.error;
    const r = await CL.sb.from(T_PROJ).update({ ifc_pfad: pfad, ifc_name: file.name, ifc_groesse: file.size }).eq('id', CL.proj.id).select().single();
    if (r.error) throw r.error;
    idbPut(pfad, await file.arrayBuffer());
  } finally { $('#busy').hidden = true; }
  await cloudOpen((await CL.sb.from(T_PROJ).select('*').eq('id', CL.proj.id).single()).data);
}

/* Projekte-Dialog */
async function projectsDialog() {
  const m = $('#modal'); m.hidden = false;
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgP"><h3 id="dlgP">Projekte</h3><p class="note">Wird geladen …</p></div>`;
  const r = await CL.sb.from(T_PROJ).select('*').order('geaendert_am', { ascending: false });
  if (r.error && dbMissing(r.error)) return setupDialog();
  const list = r.data || [];
  const cur = S.source === 'cloud' ? CL.proj?.id : null;
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgP">
    <h3 id="dlgP">Projekte</h3>
    <p class="note">Gemeinsame Projekte sehen und bearbeiten alle, die für die Riedel-Tools freigeschaltet sind. Das IFC-Modell liegt einmal in der Ablage, Status, Ablauf, Zusagen, Hindernisse, Mängel und Tagebuch werden live abgeglichen.</p>
    ${r.error ? `<p class="note" style="color:var(--st-verzug)">Projektliste nicht erreichbar: ${esc(r.error.message)}</p>` : ''}
    <div class="list">${list.length ? list.map(p => `<div class="row"><span class="t">${esc(p.name)}${p.id === cur ? ' <span class="chip" style="color:var(--st-fertig)">geöffnet</span>' : ''}</span>
      <button class="btn small ${p.id === cur ? '' : 'primary'}" data-popen="${esc(p.id)}">${p.id === cur ? 'Neu laden' : 'Öffnen'}</button>
      <span class="s">${esc(p.ifc_name || 'ohne Modell')} · ${fmtN((p.ifc_groesse || 0) / 1048576, 1)} MB · geändert ${new Date(p.geaendert_am).toLocaleDateString('de-DE')} · angelegt von ${esc(p.angelegt_mail || '–')}</span></div>`).join('')
      : '<div class="empty">Noch keine gemeinsamen Projekte.</div>'}</div>
    ${S.source === 'ifc' ? `<form class="form" data-pform="create"><label class="field full"><span>Aktuelles Modell „${esc(S.file)}“ fürs Team freigeben – Projektname</span><input id="p-name" name="name" required value="${esc(S.project.name)}"></label>
      <p class="note full">Der bisherige Stand aus diesem Browser (Ablauf, Status, Zusagen, Mängel …) wird mit übernommen.</p>
      <div class="act"><button class="btn primary" type="submit">Gemeinsames Projekt anlegen</button></div></form>`
      : S.source === 'cloud' ? `<div class="form"><p class="note full">Neue Planstände: IFC-Datei hochladen. Status und Termine bleiben über die IFC-GUIDs erhalten.</p>
        <div class="act"><label class="btn" for="p-ifc">Neue Modellversion hochladen</label><input type="file" id="p-ifc" accept=".ifc" hidden></div></div>`
      : `<p class="note">Um ein neues gemeinsames Projekt anzulegen: Dialog schließen, „IFC laden“ und hier wieder „Projekte“ öffnen.</p>`}
    <div class="gedit" style="justify-content:space-between"><button class="btn" data-pdemo>Demo (nur in diesem Browser)</button><button class="btn" data-close>Schließen</button></div>
    <p class="note" id="p-msg"></p></div>`;
}
async function setupDialog() {
  const m = $('#modal'); m.hidden = false;
  let sql = ''; try { sql = await (await fetch('supabase-setup.sql', { cache: 'no-cache' })).text(); } catch { sql = '-- baustelle-4d/supabase-setup.sql im Repo öffnen'; }
  const ref = (window.RIEDEL_AUTH?.url.match(/^https:\/\/([^.]+)\.supabase\.co/) || [])[1];
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgS"><h3 id="dlgS">Gemeinsamen Speicher einrichten</h3>
    <p>Einmalig nötig, danach arbeiten alle Freigeschalteten auf demselben Stand.</p>
    <ol class="note" style="padding-left:18px;margin:0"><li>SQL kopieren</li><li><a href="https://supabase.com/dashboard/project/${esc(ref || '')}/sql/new" target="_blank" rel="noopener">Supabase SQL Editor öffnen</a>, einfügen und „Run“ klicken</li><li>Hier „Erneut prüfen“</li></ol>
    <textarea id="setupSql" readonly>${esc(sql)}</textarea>
    <div class="gedit" style="justify-content:flex-end"><button class="btn" id="sqlCopy">SQL kopieren</button><button class="btn" data-close>Später</button><button class="btn primary" id="sqlCheck">Erneut prüfen</button></div></div>`;
  $('#sqlCopy').onclick = async () => { try { await navigator.clipboard.writeText(sql); toast('SQL kopiert.'); } catch { $('#setupSql').select(); toast('Text markiert – mit Strg+C kopieren.'); } };
  $('#sqlCheck').onclick = async () => { const r = await CL.sb.from(T_PROJ).select('id').limit(1); if (r.error) toast(dbMissing(r.error) ? 'Tabellen noch nicht gefunden.' : r.error.message); else { CL.setup = true; projectsDialog(); } };
}
$('#btnProj').addEventListener('click', () => projectsDialog());
$('#modal').addEventListener('click', async e => {
  const o = e.target.closest('[data-popen]');
  if (o) { $('#modal').hidden = true; const r = await CL.sb.from(T_PROJ).select('*').eq('id', o.dataset.popen).single(); if (r.data) cloudOpen(r.data); else toast('Projekt nicht gefunden.'); return; }
  if (e.target.closest('[data-pdemo]')) { $('#modal').hidden = true; cloudLeave(); startDemo(loadSaved()?.source === 'demo' ? loadSaved() : undefined); }
});
$('#modal').addEventListener('change', async e => {
  if (e.target.id !== 'p-ifc' || !e.target.files[0]) return;
  $('#modal').hidden = true;
  try { await cloudNewModel(e.target.files[0]); } catch (er) { toast('Hochladen fehlgeschlagen: ' + (er.message || er), 6000); }
});
$('#modal').addEventListener('submit', async e => {
  const f = e.target; if (f.dataset.pform !== 'create') return; e.preventDefault();
  const name = String(new FormData(f).get('name') || '').trim(); if (!name) return;
  f.querySelector('button[type=submit]').disabled = true;
  try { $('#modal').hidden = true; await cloudCreate(name); }
  catch (er) { toast((dbMissing(er) ? 'Der gemeinsame Speicher ist noch nicht eingerichtet. ' : 'Anlegen fehlgeschlagen: ') + (er.message || er), 7000); if (dbMissing(er)) setupDialog(); }
});

/* Fotos aus der Ablage anzeigen */
const fotoAttr = f => isLocalFoto(f) || typeof f === 'string' ? `src="${f}"` : (CL.urls.get(f.pfad) ? `src="${CL.urls.get(f.pfad)}"` : `data-pfad="${esc(f.pfad)}"`);
async function hydrateFotos() {
  const imgs = [...document.querySelectorAll('img[data-pfad]')]; if (!imgs.length || !CL.sb) return;
  const paths = [...new Set(imgs.map(i => i.dataset.pfad))];
  const r = await CL.sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  for (const x of r.data || []) if (x.signedUrl) CL.urls.set(x.path, x.signedUrl);
  imgs.forEach(i => { const u = CL.urls.get(i.dataset.pfad); if (u) { i.src = u; i.removeAttribute('data-pfad'); } });
}

async function cloudInit() {
  if (!window.RIEDEL_AUTH) return;
  for (let i = 0; i < 100 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.supabase) return;
  const A = window.RIEDEL_AUTH;
  CL.sb = window.supabase.createClient(A.url, A.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: A.storageKey } });
  const { data } = await CL.sb.auth.getSession(); if (!data?.session) return;
  CL.me = data.session.user.id; CL.mail = data.session.user.email || '';
  CL.ready = true; $('#btnProj').hidden = false; renderHeader();
  const r = await CL.sb.from(T_PROJ).select('*').order('geaendert_am', { ascending: false });
  if (r.error) { if (dbMissing(r.error)) toast('Für die gemeinsame Ablage muss einmal das Setup-SQL ausgeführt werden – siehe „Projekte“.', 6000); return; }
  CL.setup = true;
  let last = null; try { last = localStorage.getItem(LAST_PROJ); } catch { }
  const p = r.data.find(x => x.id === last);
  if (p) cloudOpen(p);
  else if (r.data.length) projectsDialog();
}

/* ---------- Start ---------- */
function afterModelChange() {
  view.sel.clear(); view.selTask = null; view.storey = 'alle';
  computeRange(); buildMaterials(); renderStoreyFilter(); renderLegend(); renderBrushes();
  knownDone = null; checkMilestones(false);
  setDate(view.date >= range.a && view.date <= range.b ? view.date : TODAY);
  renderAll();
}
function startDemo(state) {
  const demo = buildDemo(); SPECS = demo.specs;
  S = state && state.source === 'demo' && state.v === 2 ? state : demo.S;
  S.lps ||= demo.S.lps;
  // Geometrie-GUIDs sind deterministisch, aber bei anderem Startdatum gespeicherter Stand → frische Demo
  if (!SPECS.every(s => S.elements[s.guid])) S = demo.S;
  reindex(); buildDemoMeshes(SPECS); view.date = TODAY; afterModelChange(); frame();
}
const saved = loadSaved();
if (saved && saved.source === 'ifc') {
  startDemo();
  toast(`Gespeicherter Stand zu „${saved.file}“ vorhanden – die IFC-Datei erneut laden, um weiterzumachen.`, 6000);
} else startDemo(saved);

const themeObs = () => { buildMaterials(); applyColors(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeObs);
new MutationObserver(themeObs).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
resize(); requestAnimationFrame(loop);
cloudInit();
</script>
