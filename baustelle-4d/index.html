<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="rb-tool" content="Baustelle 4D">
<script src="../assets/auth-gate.js"></script>
<title>Baustelle 4D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* Layout: Leitstand — 3D-Viewport links mit Zeitleiste, rechts Bauleitungs-Panel mit Reitern; auf dem Handy untereinander */
:root{
  --bg:#e9ecee; --panel:#fbfcfc; --raise:#f1f3f4; --fg:#191d20; --muted:#5a646b; --line:#d3d9dc;
  --viewport:#d9dfe2; --grid:#b9c1c6;
  --brand:#ff0000; --accent:#d10a0a; --accent-fg:#ffffff;
  --st-ghost:#8d979e; --st-arbeit:#e0951a; --st-fertig:#3a9459; --st-abgenommen:#2a78ad;
  --st-verzug:#e04a2b; --st-vorsprung:#6a5acd; --st-beton:#9aa0a5;
  --v0:#b4434b; --v1:#e0951a; --v2:#2a78ad; --v3:#3a9459; --mangel:#c2187a; --erde:#8a6a3f; --note:#fdf0a6; --note-ok:#e3f1dc; --note-bad:#f8e0dc; --note-fg:#2b2a20; --note-edge:#e2c94a; --k0:#2f6fb0; --k1:#3a8f57; --k2:#d07a26; --k3:#8a57b3; --k4:#c03d6a; --k5:#1f8f8c; --k6:#a88418; --k7:#5b6a78;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --panel:#191d21; --raise:#21262b; --fg:#e6e9eb; --muted:#97a1a8; --line:#2c3338;
  --viewport:#0f1214; --grid:#2b3238; --accent:#ff3b30; --accent-fg:#ffffff;
  --st-ghost:#7d878e; --st-arbeit:#f0a72c; --st-fertig:#4cb36f; --st-abgenommen:#4a9bd4;
  --st-verzug:#ff6a48; --st-vorsprung:#9488ee; --st-beton:#7f868c;
  --v0:#e0606a; --v1:#f0a72c; --v2:#4a9bd4; --v3:#4cb36f; --mangel:#e84aa6; --erde:#a7865a; --note:#4b4526; --note-ok:#24382a; --note-bad:#45292a; --note-fg:#f0ead0; --note-edge:#b59a2e; --k0:#5b9de0; --k1:#5cbf7d; --k2:#f0a052; --k3:#b088dc; --k4:#e46c96; --k5:#4cc2be; --k6:#d6b347; --k7:#93a3b2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#191d21; --raise:#21262b; --fg:#e6e9eb; --muted:#97a1a8; --line:#2c3338;
  --viewport:#0f1214; --grid:#2b3238; --accent:#ff3b30; --accent-fg:#ffffff;
  --st-ghost:#7d878e; --st-arbeit:#f0a72c; --st-fertig:#4cb36f; --st-abgenommen:#4a9bd4;
  --st-verzug:#ff6a48; --st-vorsprung:#9488ee; --st-beton:#7f868c;
  --v0:#e0606a; --v1:#f0a72c; --v2:#4a9bd4; --v3:#4cb36f; --mangel:#e84aa6; --erde:#a7865a; --note:#4b4526; --note-ok:#24382a; --note-bad:#45292a; --note-fg:#f0ead0; --note-edge:#b59a2e; --k0:#5b9de0; --k1:#5cbf7d; --k2:#f0a052; --k3:#b088dc; --k4:#e46c96; --k5:#4cc2be; --k6:#d6b347; --k7:#93a3b2; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;background:var(--brand);display:grid;place-items:center;color:#fff;font:700 13px/1 var(--f-display);letter-spacing:.04em;flex:none}
.brand h1{font:700 19px/1 var(--f-display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.proj{display:flex;flex-direction:column;min-width:0}
.proj input{border:0;background:transparent;padding:0;font-weight:600;font-size:13px;min-width:0;width:22ch}
.proj small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.score{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.meter{width:180px}
.meter .bar{position:relative;height:8px;background:var(--raise);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;display:block}
.meter .bar .soll{background:repeating-linear-gradient(135deg,var(--st-ghost) 0 3px,transparent 3px 6px);opacity:.55}
.meter .bar .ist{background:var(--st-fertig)}
.meter .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.meter .lab b{color:var(--fg);font-weight:600}
.level{font:600 13px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.level b{color:var(--accent)}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raise);padding:6px 11px;border-radius:var(--r);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

main.work{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:var(--viewport);display:grid;grid-template-rows:1fr auto}
#view{position:relative;min-height:0;overflow:hidden}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.tools>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.seg select{border:0;background:transparent;font-size:12.5px;padding:4px 6px}
.brushes{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px 6px}
.brushes button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.brushes button[aria-pressed="true"]{border-color:var(--fg)}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.dot.ghost{background:transparent;border:1.5px dashed var(--st-ghost)}
.hint{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:12px;max-width:300px}
.banner{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:10px 18px;border-radius:var(--r);text-align:center;pointer-events:none;box-shadow:0 8px 30px rgb(0 0 0 / .25);transition:opacity .4s,transform .4s;max-width:calc(100% - 32px)}
.banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.banner strong{font:700 22px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.banner.off{opacity:0;transform:translate(-50%,-10px)}
.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--accent)}
.cross::before{left:6px;top:0;width:2px;height:14px}.cross::after{top:6px;left:0;height:2px;width:14px}

.timeline{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 12px;display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 14px;align-items:center}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.play svg{width:16px;height:16px;fill:currentColor}
.when{min-width:170px}
.when strong{display:block;font:700 22px/1 var(--f-display);letter-spacing:.02em}
.when span{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.track{position:relative;min-width:0;padding-top:12px}
.track input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ticks{position:absolute;left:8px;right:8px;top:0;height:12px}
.ticks i{position:absolute;top:0;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:var(--st-fertig);border:1px solid var(--panel)}
.ticks i.open{background:var(--panel);border-color:var(--st-ghost)}
.ticks b{position:absolute;top:-2px;width:2px;height:13px;margin-left:-1px;background:var(--accent)}
.tl-right{display:flex;gap:6px;align-items:center}

aside.panel{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:11px 11px 9px;font:600 13.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .cnt{font:500 10.5px/1 var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:1px 5px;margin-left:3px;vertical-align:1px}
.pane{overflow:auto;padding:14px 16px 28px;min-height:0;display:flex;flex-direction:column;gap:16px}
.pane h2{font:700 15px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.pane h3{font:600 17px/1.2 var(--f-display);margin:0;text-wrap:balance}
.sect{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.statusrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.statusrow button{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:7px 4px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px}
.statusrow button[aria-pressed="true"]{border-color:var(--fg);background:var(--panel);box-shadow:inset 0 0 0 1px var(--fg)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;background:var(--panel)}
.row:first-child{border-top:0}
.row.click{cursor:pointer}.row.click:hover{background:var(--raise)}
.row .t{font-weight:500;min-width:0}
.row .s{grid-column:1/-1;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;line-height:1.4}
.warn{display:grid;grid-template-columns:4px minmax(0,1fr);gap:0 10px;padding:8px 10px 8px 0;font-size:13px;border-top:1px solid var(--line)}
.warn:first-child{border-top:0}
.warn::before{content:"";background:var(--c,var(--st-verzug));border-radius:0 2px 2px 0}
.warn small{display:block;color:var(--muted);font-size:12px}
.lvl{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.lvl .bar{height:10px;background:var(--raise);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.lvl .bar i{position:absolute;inset:0 auto 0 0;background:var(--st-fertig)}
.lvl .bar u{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--fg);opacity:.6}
.ms{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.ms:first-child{border-top:0}
.ms .d{width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--st-ghost);margin-left:3px}
.ms.done .d{background:var(--st-fertig);border-color:var(--st-fertig)}
.gantt{font-size:12.5px}
.grow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow.sel .gname{color:var(--accent)}
.ghead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gname{font-weight:600;cursor:pointer;min-width:0}
.gbar{position:relative;height:12px;background:var(--raise);border-radius:2px}
.gbar .p{position:absolute;top:2px;bottom:2px;border:1px solid var(--st-ghost);border-radius:2px;background:var(--panel)}
.gbar .p i{position:absolute;inset:0 auto 0 0;background:var(--st-fertig);opacity:.85}
.gbar .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.gedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gedit input[type=date]{font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font-size:13.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.form .full{grid-column:1/-1}
.form .act{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .sum{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.card details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.card label.ck{display:flex;gap:6px;font-size:12.5px;align-items:center;padding:2px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
table.tab{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.tab th,table.tab td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tab th:first-child,table.tab td:first-child{text-align:left;white-space:normal}
table.tab th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
table.tab tfoot td{font-weight:600;border-bottom:0}
.tw{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:13px;text-align:center}
.note{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 11px;border-radius:10px;font-size:13.5px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--panel);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--raise);border:1px solid var(--line);border-bottom-left-radius:3px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .btn{white-space:normal;text-align:left}
.prop{border-color:var(--fg)}

.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal textarea{width:100%;min-height:160px;font:12px/1.4 var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:8px}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--viewport) 70%,transparent);z-index:5;font:600 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#projSrc[data-sync]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
#projSrc[data-sync="ok"]::before{background:var(--st-fertig)}#projSrc[data-sync="err"]::before{background:var(--st-arbeit)}#projSrc[data-sync="setup"]::before{background:var(--st-verzug)}#projSrc[data-sync=""]::before{display:none}
html:has(> .rb-bar) body{height:calc(100% - var(--rb-bar-h, 48px))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:var(--r);font-size:13px;z-index:30;max-width:calc(100% - 32px)}

/* Last Planner – Aufbau wie gängige Taktplanungs-Tools: Werkzeugleiste, Filterleiste links, Plan in der Mitte, Details rechts */
.lps{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:232px minmax(0,1fr);min-height:0;min-width:0;background:var(--bg)}
.lps.withdrawer{grid-template-columns:232px minmax(0,1fr) 360px}
.lps-head{grid-column:1/-1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.lps-head .sp,.dact .sp{flex:1}
.lseg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.lseg button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lseg button[aria-selected="true"]{background:var(--fg);color:var(--panel)}
.cnt{font:600 10.5px/1 var(--f-mono);background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:2px 5px}
.cnt.bad{background:var(--st-verzug);border-color:var(--st-verzug);color:#fff}
.lseg button[aria-selected="true"] .cnt:not(.bad){background:transparent;color:inherit;border-color:currentColor}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .wk{display:flex;flex-direction:column;line-height:1.1;min-width:104px;text-align:center}
.weeknav .wk strong{font:700 17px/1 var(--f-display);letter-spacing:.03em}
.weeknav .wk span{font-size:11.5px;color:var(--muted)}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:0;color:var(--fg);flex:none}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn svg,.btn svg{width:14px;height:14px;flex:none}
.search input{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:5px 9px;width:170px;font-size:13px}
.ppc{font:600 13px/1 var(--f-display);letter-spacing:.05em;padding:7px 9px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);white-space:nowrap}
.ppc.good,.tile .good,.goodc{color:var(--st-fertig)}.ppc.mid,.tile .mid,.midc{color:var(--st-arbeit)}.ppc.bad,.tile .bad,.badc{color:var(--st-verzug)}
.ppc.good,.ppc.mid,.ppc.bad{border-color:currentColor}
.okc{color:var(--st-fertig)}
.btn.primary-soft{background:color-mix(in srgb,var(--st-fertig) 14%,var(--panel));border-color:color-mix(in srgb,var(--st-fertig) 45%,var(--line));color:var(--fg)}
.btn.warn-soft{background:color-mix(in srgb,var(--st-verzug) 12%,var(--panel));border-color:color-mix(in srgb,var(--st-verzug) 45%,var(--line));color:var(--fg)}
.btn.warn-soft svg{color:var(--st-verzug)}

/* Filterleiste */
.lps-side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:20px;min-height:0}
.side-sec{display:flex;flex-direction:column;gap:8px}
.side-sec h4{margin:0;font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crews{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.crewbtn{width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:transparent;padding:6px 6px;border-radius:5px;text-align:left;font-size:13px}
.crewbtn:hover{background:var(--raise)}
.crewbtn i{width:12px;height:12px;border-radius:3px}
.crewbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crewbtn b{font:500 11.5px var(--f-mono);color:var(--muted)}
.crewbtn.off{color:var(--muted)}.crewbtn.off i{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--st-ghost)}
.crew-add{display:flex;gap:6px}
.crew-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--raise);font-size:12.5px}
.wkstat .stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--raise);border:1px solid var(--line)}
.stack .s-ok{background:var(--st-fertig)}.stack .s-no{background:var(--st-verzug)}.stack .s-op{background:var(--st-ghost);opacity:.45}
.wkstat dl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin:8px 0 0;font-size:12.5px}
.wkstat dt{display:flex;align-items:center;gap:6px;color:var(--muted)}.wkstat dd{margin:0;font-weight:600}
.mslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.mslist li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.mslist small{color:var(--muted)}
.dia{width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--fg);display:block;margin-left:1px}

/* Statussymbole */
.sti{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;flex:none;color:var(--muted)}
.sti svg{width:12px;height:12px}
.sti.erledigt{background:var(--st-fertig);color:#fff}
.sti.nicht{background:var(--st-verzug);color:#fff}

/* Planfläche */
.lps-body{overflow:auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.lps-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;min-height:30px}
.tl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%}
.nowline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.7;pointer-events:none;z-index:1}

/* Wochenplan */
.wgrid{display:grid;grid-template-columns:168px repeat(5,minmax(140px,1fr));min-width:868px}
.wh{position:sticky;top:0;z-index:3;background:var(--panel);padding:8px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.wh span{font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.wh b{font-size:15px;color:var(--fg);font-weight:600}
.wh.lab{border-left:0;font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.wh.today span,.wh.today b{color:var(--accent)}
.wl{padding:10px 10px 10px 12px;border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 var(--k);display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.wl b{font:600 14px/1.15 var(--f-display);letter-spacing:.02em}
.wl small{color:var(--muted);font-size:11.5px}
.lane{grid-column:2 / span 5;position:relative;border-bottom:1px solid var(--line);min-height:84px}
.lane.over{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.lane .cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.cell{border:0;border-left:1px solid var(--line);background:transparent;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 6px 6px 0;color:transparent}
.cell svg{width:14px;height:14px}
.cell.today{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.cell:hover,.cell:focus-visible{color:var(--muted);background:color-mix(in srgb,var(--fg) 3.5%,transparent)}
.lane .cards{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-flow:row dense;gap:6px;padding:8px 6px 28px;pointer-events:none}
.card2{pointer-events:auto;min-width:0;background:color-mix(in srgb,var(--k) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--k) 32%,var(--line));border-left:4px solid var(--k);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;font-size:12.5px;line-height:1.3;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.card2:hover{box-shadow:0 2px 8px -2px rgb(0 0 0 / .2)}
.card2.sel{outline:2px solid var(--fg);outline-offset:1px}
.card2.dragging{opacity:.5}
.card2 .c-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.card2 .c-top b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.card2 .c-meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11.5px;color:var(--muted)}
.card2 .c-meta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.card2 .why{color:var(--st-verzug);font-weight:600}
.card2 .cwarn{display:inline-flex;align-items:center;gap:3px;color:var(--st-verzug);font-weight:600}
.card2 .cwarn svg{width:12px;height:12px}
.card2.erledigt{background:color-mix(in srgb,var(--k) 6%,var(--panel))}
.card2.erledigt .c-top b{color:var(--muted)}
.card2.nicht{border-color:color-mix(in srgb,var(--st-verzug) 55%,var(--line));border-left-color:var(--k)}

/* Vorschau als Balkenplan */
.ggrid{display:grid;grid-template-columns:260px repeat(var(--n),minmax(26px,1fr));min-width:calc(260px + var(--n) * 26px);font-size:12.5px}
.gh{position:sticky;z-index:3;background:var(--panel);border-bottom:1px solid var(--line)}
.gh.wkh{top:0;padding:6px 8px;border-left:1px solid var(--line);font:600 12.5px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden}
.gh.wkh small{font:400 11px var(--f-body);color:var(--muted);letter-spacing:0;text-transform:none}
.gh.gh1{top:0}
.gh.dh{top:26px;text-align:center;font:500 10.5px/1 var(--f-mono);color:var(--muted);padding:4px 0}
.gh.dh.wkstart{border-left:1px solid var(--line)}
.gh.dh.today{color:var(--accent);font-weight:700}
.gh.lab{top:26px;left:0;z-index:4;padding:4px 10px;font:600 11.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line)}
.gh.lab.gh1{top:0;z-index:4;border-right:1px solid var(--line)}
.ggroup{grid-column:1;position:sticky;left:0;z-index:2;border-right:1px solid var(--line)!important;display:flex;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--line);background:var(--raise);padding:6px 10px;font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:left}
.ggroup span{display:inline-flex;transition:transform .15s}.ggroup span.rot{transform:rotate(90deg)}
.ggroup svg{width:12px;height:12px}
.ggroup small{font:500 11px var(--f-mono);color:var(--muted);margin-left:2px}
.glab{position:sticky;left:0;z-index:2;grid-column:1;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;height:36px;padding:0 10px;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel);text-align:left;font-size:12.5px}
.glab:hover,.glab.sel{background:var(--raise)}
.glab.sel{box-shadow:inset 3px 0 0 var(--fg)}
.glab i{width:10px;height:10px;border-radius:3px}
.glab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glab em{font-style:normal;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.glab em svg{width:11px;height:11px}
.glab.msl{cursor:default;font:600 11.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-template-columns:1fr}
.grow2{position:relative;border-bottom:1px solid var(--line);min-width:0}
.grow2.sel{background:color-mix(in srgb,var(--fg) 3%,transparent)}
.gbars{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:center;height:36px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--n) * 5) 100%}
.gbar2{position:relative;height:22px;border-radius:4px;overflow:hidden;display:flex;align-items:center;gap:4px;padding:0 6px;cursor:pointer;background:color-mix(in srgb,var(--k) 20%,var(--panel));border:1px solid var(--k);font-size:11.5px;font-weight:500;z-index:2;min-width:0}
.gbar2 .prog{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--k) 50%,var(--panel))}
.gbar2 span{position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.gbar2 em{position:relative;display:inline-flex;align-items:center;gap:2px;font-style:normal;font-weight:700;color:var(--st-verzug);background:var(--panel);border-radius:3px;padding:0 3px;font-size:11px}
.gbar2 em svg{width:11px;height:11px}
.gbar2.blocked{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--st-verzug) 20%,transparent) 0 4px,transparent 4px 8px);border-style:dashed}
.gbar2.committed{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--st-abgenommen)}
.msrow{height:36px}
.msd{position:absolute;top:6px;transform:translateX(-5px);display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;color:var(--muted);z-index:2}
.msd i{width:10px;height:10px;transform:rotate(45deg);background:var(--fg);display:block}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.lg{width:22px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--k0);background:color-mix(in srgb,var(--k0) 20%,var(--panel))}
.lg.blocked{border-style:dashed;background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--st-verzug) 30%,transparent) 0 3px,transparent 3px 6px)}
.lg.committed{box-shadow:0 0 0 2px var(--st-abgenommen)}
.lg.prog{background:color-mix(in srgb,var(--k0) 50%,var(--panel))}
.lg.now{width:2px;height:12px;border:0;background:var(--accent)}

/* Hindernisliste */
.tblwrap{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.htab th{position:sticky;top:0;background:var(--panel);z-index:1}
.htab td,.htab th{text-align:left!important;white-space:normal!important;vertical-align:top;padding:8px 10px}
.htab td:first-child{width:30px}
.htab tbody tr{cursor:pointer}
.htab tbody tr:hover td{background:var(--raise)}
.htab tr.done td{color:var(--muted)}.htab tr.done b{text-decoration:line-through}
.htab .kat,.con2 .kat{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* Kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile strong{font:700 28px/1.1 var(--f-display)}
.tile small{font-size:12px;color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.kcard.full{grid-column:1/-1}
@media (max-width:1000px){.kpi-grid{grid-template-columns:minmax(0,1fr)}}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kcard h2{font:700 14px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .target{stroke:var(--fg);stroke-dasharray:4 4;stroke-width:1.2;opacity:.6}
.chart .lbl{fill:var(--muted);font:11px var(--f-body)}
.chart .val{fill:var(--fg);font:600 11px var(--f-mono)}
.pareto{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12.5px}
.pareto .bar{height:12px;background:var(--raise);border-radius:2px;overflow:hidden}
.pareto .bar i{display:block;height:100%;background:var(--st-verzug)}

/* Details rechts */
.lps-drawer{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
.dh2{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dh2 .kind{display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh2 .kind::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--k)}
.dform,.dbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.dbody .dform{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.dbody h3{font:600 19px/1.2 var(--f-display);margin:0}
.dbody h4{margin:4px 0 0;font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dform fieldset{border:0;padding:0;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stseg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.stseg label{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border-radius:4px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.stseg input{position:absolute;opacity:0;pointer-events:none}
.stseg label:has(input:checked){background:var(--fg);color:var(--panel)}
.stseg label:has(input:focus-visible){outline:2px solid var(--accent)}
.dwarn{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:10px;border-radius:6px;background:color-mix(in srgb,var(--st-verzug) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--st-verzug) 40%,var(--line));font-size:12.5px}
.dwarn svg{width:16px;height:16px;color:var(--st-verzug)}
.dwarn small{display:block;color:var(--muted);margin-top:2px}
.dact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.freestate{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-weight:600;font-size:13px}
.freestate svg{width:15px;height:15px}
.freestate.free{background:color-mix(in srgb,var(--st-fertig) 12%,var(--panel));color:var(--st-fertig)}
.freestate.blocked{background:color-mix(in srgb,var(--st-verzug) 10%,var(--panel));color:var(--st-verzug)}
.conlist{display:flex;flex-direction:column}
.con2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.con2:first-child{border-top:0}
.con2 b{font-weight:600;display:block}
.con2 small{display:block;color:var(--muted);font-size:11.5px}
.con2.done b{text-decoration:line-through;color:var(--muted)}
.con2 .iconbtn{width:24px;height:24px;background:transparent;border-color:transparent;color:var(--muted)}

/* 3D neben dem Plan */
.lps.split{grid-template-columns:minmax(0,1fr) minmax(320px,42%)}
.lps.split.withdrawer{grid-template-columns:minmax(0,1fr) minmax(300px,36%) 340px}
.lps.split .lps-side{display:none}
.lps-3d{display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--line);background:var(--viewport);min-height:0;min-width:0}
.lps-3d header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.lps-3d header>b{font:600 12.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.lps-3d.assigning header{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--fg)}
.lps-3d .vp{position:relative;min-height:0;overflow:hidden}
.lps-3d .vp canvas{display:block;width:100%;height:100%;touch-action:none}
.lps-3d.assigning .vp canvas{cursor:crosshair}
.btn.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.gsum{position:relative;height:10px;border-radius:2px;background:var(--fg);opacity:.75;cursor:grab;z-index:2;min-width:0}
.gsum span{position:absolute;left:4px;top:-1px;font:600 9px/12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--panel);white-space:nowrap;overflow:hidden;max-width:calc(100% - 8px)}
.gsum:hover{opacity:1}
.grow2.grp{background:var(--raise)}
.grow2.grp .gbars{height:22px}
.gbar2{cursor:grab;touch-action:none;user-select:none}
.gbar2 .grip{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:linear-gradient(90deg,transparent 3px,color-mix(in srgb,var(--k) 70%,transparent) 3px 4px,transparent 4px 5px,color-mix(in srgb,var(--k) 70%,transparent) 5px 6px,transparent 6px)}
.gbar2.selbar{outline:2px solid var(--fg);outline-offset:1px}
.gbar2.dragging,.gsum.dragging{opacity:.85;cursor:grabbing;z-index:5;box-shadow:0 6px 16px -6px rgb(0 0 0 / .45)}
.gbar2[data-tip]::after,.gsum[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--fg);color:var(--panel);font:600 11px/1 var(--f-mono);padding:4px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.gbar2.dragging,.gsum.dragging{overflow:visible}
.gbars{overflow:visible}
.lg.grp{height:6px;background:var(--fg);border:0;opacity:.75}
.deps{display:flex;flex-direction:column;gap:4px}
.dep{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.dep small{display:block;color:var(--muted);font-size:11.5px}
.dform.inline{padding:0}
@media (max-width:1180px){.lps.split.withdrawer{grid-template-columns:minmax(0,1fr) minmax(300px,42%)}}
@media (max-width:900px){
  .lps.split,.lps.split.withdrawer{grid-template-columns:minmax(0,1fr)}
  .lps-3d{order:-1;height:46vh;border-left:0;border-bottom:1px solid var(--line)}
  .lps-head{order:-2}
}
@media (max-width:1180px){
  .lps.withdrawer{grid-template-columns:232px minmax(0,1fr)}
  .lps-drawer{grid-row:2;grid-column:1/-1;position:absolute;right:0;top:0;bottom:0;width:min(380px,100%);z-index:8;box-shadow:-12px 0 30px -12px rgb(0 0 0 / .35)}
}
@media (max-width:900px){
  .lps,.lps.withdrawer{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);overflow:visible}
  .lps-side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:8px 16px;gap:12px}
  .lps-side .side-sec:not(:first-child),.lps-side h4,.crew-add{display:none}
  .crews{flex-direction:row;gap:4px}
  .crewbtn{white-space:nowrap;border:1px solid var(--line);border-radius:14px;padding:4px 10px;width:auto}
  .lps-body{overflow:visible}

  .search input{width:130px}

<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ---------- Hilfen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n, d = 1) => (n ?? 0).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtE = n => (n ?? 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const uid = () => Math.random().toString(36).slice(2, 10);
const D = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  fmt(dt) { return dt.toISOString().slice(0, 10); },
  add(s, n) { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.fmt(d); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); },
  isWE(s) { const w = D.parse(s).getUTCDay(); return w === 0 || w === 6; },
  addWD(s, n) { let d = s, k = 0; if (n < 0) { while (k < -n) { d = D.add(d, -1); if (!D.isWE(d)) k++; } return d; } while (D.isWE(d)) d = D.add(d, 1); while (k < n) { d = D.add(d, 1); if (!D.isWE(d)) k++; } return d; },
  wdBetween(a, b) { let n = 0, d = a; while (d < b) { d = D.add(d, 1); if (!D.isWE(d)) n++; } return n; },
  monday(s) { const w = (D.parse(s).getUTCDay() + 6) % 7; return D.add(s, -w); },
  kw(s) { const d = D.parse(s); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const fy = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7); },
  de(s) { return s ? D.parse(s).toLocaleDateString('de-DE', { timeZone: 'UTC', day: '2-digit', month: '2-digit', year: 'numeric' }) : '–'; },
  short(s) { return s ? D.parse(s).toLocaleDateString('de-DE', { timeZone: 'UTC', day: '2-digit', month: '2-digit' }) : '–'; },
  wd(s) { return D.parse(s).toLocaleDateString('de-DE', { timeZone: 'UTC', weekday: 'short' }); }
};
const now = new Date();
const TODAY = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const GCH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_$';
const fakeGuid = r => Array.from({ length: 22 }, (_, i) => GCH[Math.floor(r() * (i ? 64 : 4))]).join('');

const STATUS = [
  { k: 'geplant', label: 'Geplant', tok: '--st-ghost' },
  { k: 'inArbeit', label: 'In Arbeit', tok: '--st-arbeit' },
  { k: 'fertig', label: 'Fertig', tok: '--st-fertig' },
  { k: 'abgenommen', label: 'Abgenommen', tok: '--st-abgenommen' }
];
const VSTATUS = [
  { label: 'Offen', tok: '--v0' }, { label: 'Angefragt', tok: '--v1' },
  { label: 'Verhandlung', tok: '--v2' }, { label: 'Beauftragt', tok: '--v3' }
];
const MTYP = { mangel: 'Mangel', behinderung: 'Behinderung', bedenken: 'Bedenkenanzeige' };

/* ---------- Zustand ---------- */
// Struktur entspricht den späteren Supabase-Tabellen: elements, tasks, vergaben, maengel, tagebuch
let S = null;
let SPECS = [];          // Geometrie (nicht gespeichert)
let taskMap = {}, vergMap = {};
const view = { mode: 'ist', tool: 'select', brush: 2, date: TODAY, storey: 'alle', tab: 'uebersicht', sel: new Set(), selTask: null };
const STORE = 'baustelle4d.v1';

function reindex() {
  for (const t of S.tasks) {   // ältere Stände ohne Abhängigkeiten
    if (t.dur == null) t.dur = Math.max(1, D.wdBetween(D.add(t.start, -1), t.end));
    if (!t.preds) { t.preds = []; t.fix = t.start; }
    if (t.fix === undefined) t.fix = null;
  }
  S.lps ||= { crews: ['Kolonne 1', 'Kolonne 2', 'NU Erdbau', 'NU Bewehrung'], commits: [], constraints: [] };
  S.projectStart ||= S.tasks.map(t => t.start).filter(Boolean).sort()[0] || TODAY;
  try { schedule(S.tasks, S.projectStart); } catch (e) { toast(e.message); }
  taskMap = Object.fromEntries(S.tasks.map(t => [t.id, t]));
  vergMap = Object.fromEntries(S.vergaben.map(v => [v.id, v]));
}
let saveT;
function save() {
  if (CL.on) return cloudSaveLater();
  if (S.source === 'cloud') return;
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify(S)); }
    catch (e) { toast('Browserspeicher voll oder gesperrt – bitte über „Daten“ sichern.'); }
  }, 400);
}
function loadSaved() { try { const s = localStorage.getItem(STORE); return s ? JSON.parse(s) : null; } catch { return null; } }

/* ---------- Status-Logik (aus Datumswerten abgeleitet) ---------- */
function istAt(e, d) {
  if (e.acceptDate && e.acceptDate <= d) return 3;
  if (e.doneDate && e.doneDate <= d) return 2;
  if (e.startDate && e.startDate <= d) return 1;
  return 0;
}
function sollAt(e, d) {
  const t = taskMap[e.taskId]; if (!t) return 0;
  if (t.end < d) return 2; if (t.start <= d) return 1; return 0;
}
function setStatus(e, s, d) {
  if (s === 0) { e.startDate = e.doneDate = e.acceptDate = null; return; }
  if (s === 1) { e.startDate = d; e.doneDate = e.acceptDate = null; return; }
  if (!e.startDate || e.startDate > d) e.startDate = d;
  if (s === 2) { e.doneDate = d; e.acceptDate = null; return; }
  if (!e.doneDate || e.doneDate > d) e.doneDate = d;
  e.acceptDate = d;
}
function vergabeLevel(e) {
  const t = taskMap[e.taskId]; if (!t || !t.vergaben?.length) return -1;
  return Math.min(...t.vergaben.map(id => vergMap[id]?.status ?? 0));
}
function colorKey(e, d) {
  const i = istAt(e, d);
  switch (view.mode) {
    case 'soll': return ['ghost', 'arbeit', 'fertig'][sollAt(e, d)];
    case 'vergleich': {
      const s = sollAt(e, d), ii = Math.min(i, 2);
      if (ii < s) return 'verzug'; if (ii > s) return 'vorsprung';
      return ['ghost', 'arbeit', 'beton'][ii];
    }
    case 'vergabe': { const v = vergabeLevel(e); return v < 0 ? 'ghost' : 'v' + v; }
    case 'freigabe': return lpsKey(e, d);
    default: return ['ghost', 'arbeit', 'fertig', 'abgenommen'][i];
  }
}
const elsArr = () => Object.values(S.elements);
function progressAt(d, filter = () => true) {
  // Beton zählt; Aushub nur, wenn der Filter nichts anderes enthält
  const A = [0, 0, 0], B = [0, 0, 0];
  for (const e of elsArr()) { if (!filter(e)) continue; const v = e.vol || 0.01, X = e.cat === 'Aushub' ? A : B; X[0] += v; if (istAt(e, d) >= 2) X[1] += v; if (sollAt(e, d) >= 2) X[2] += v; }
  const [tot, ist, soll] = B[0] ? B : A;
  return { ist: tot ? ist / tot : 0, soll: tot ? soll / tot : 0, tot: B[0] };
}

/* ---------- Terminrechnung ---------- */
// Vorgang: dur (AT), preds [{id, typ: 'EA'|'AA', lag}], fix = frühester Start
function schedule(tasks, p0) {
  const map = Object.fromEntries(tasks.map(t => [t.id, t])), done = new Set(), vis = new Set();
  const calc = t => {
    if (done.has(t.id)) return;
    if (vis.has(t.id)) throw new Error(`Zirkelbezug bei „${t.name}“`);
    vis.add(t.id);
    let s = t.fix || p0;
    for (const p of t.preds || []) {
      const q = map[p.id]; if (!q) continue; calc(q);
      const lag = Math.round(+p.lag || 0);
      const c = p.typ === 'AA' ? D.addWD(q.start, lag) : D.addWD(q.end, 1 + lag);
      if (c > s) s = c;
    }
    while (D.isWE(s)) s = D.add(s, 1);
    t.start = s; t.end = D.addWD(s, Math.max(1, Math.round(t.dur || 1)) - 1);
    vis.delete(t.id); done.add(t.id);
  };
  tasks.forEach(calc);
}

/* ---------- Demo: Verwaltungsgebäude + Halle in 2 Abschnitten ---------- */
function buildDemo() {
  const r = rng(41);
  const specs = [], elements = {}, tasks = [], vergaben = [];
  const V = (id, gewerk, nu, summe, status) => vergaben.push({ id, gewerk, nu, summe, status, datum: null });
  V('v-erd', 'Erdarbeiten & Baugrube', 'Erdbau Schmitt (Beispiel)', 148000, 3);
  V('v-beton', 'Transportbeton', 'Betonwerk Mainfranken (Beispiel)', 214000, 3);
  V('v-bew', 'Bewehrung liefern & verlegen', 'Stahlbau Kraus (Beispiel)', 268500, 3);
  V('v-ger', 'Fassadengerüst Verwaltung', 'Gerüstbau Haas (Beispiel)', 38400, 2);
  V('v-ft', 'Fertigteiltreppen', '', 0, 1);
  V('v-fth', 'Fertigteile Halle (Stützen, Binder, Sockel)', '', 0, 1);
  V('v-ind', 'Industrieboden Halle', '', 0, 0);
  V('v-abd', 'Attika-Abdichtung', '', 0, 0);
  const start = D.add(D.monday(TODAY), -63);
  const TYPE = { Aushub: 'IfcEarthworksCut', Bodenplatte: 'IfcSlab', Decke: 'IfcSlab', Hallensohle: 'IfcSlab', 'Außenwand': 'IfcWall', Innenwand: 'IfcWall', Attika: 'IfcWall', Sockelwand: 'IfcWall', 'Stütze': 'IfcColumn', Binder: 'IfcBeam', Fundament: 'IfcFooting' };
  const mk = (guid, name, cat, storey, vol) => (elements[guid] = { guid, name, type: TYPE[cat] || 'IfcBuildingElement', cat, storey, vol, taskId: null, startDate: null, doneDate: null, acceptDate: null });
  const box = (name, cat, storey, min, max) => {
    const guid = fakeGuid(r);
    specs.push({ guid, kind: 'box', min, max });
    mk(guid, name, cat, storey, (max[0] - min[0]) * (max[1] - min[1]) * (max[2] - min[2]));
    return guid;
  };
  const stair = (storey, y0, h) => {
    const guid = fakeGuid(r), len = Math.hypot(4, h);
    specs.push({ guid, kind: 'stair', x: 1.1, z0: 1.0, z1: 5.0, y0, h, w: 1.2, t: 0.2 });
    mk(guid, `${storey} · Treppenlauf`, 'Treppe', storey, 1.2 * len * 0.2).type = 'IfcStairFlight';
    return guid;
  };
  const P = (t, typ = 'EA', lag = 0) => ({ id: t.id, typ, lag });
  const task = (name, storey, dur, guids, vergs, preds = [], grp = '') => {
    const t = { id: 't' + (tasks.length + 1), name, storey, dur, preds, fix: null, vergaben: vergs, start: null, end: null, grp };
    guids.forEach(g => elements[g].taskId = t.id); tasks.push(t); return t;
  };

  // Erdarbeiten laufen fortlaufend durch: Verwaltung → Halle 1 → Halle 2
  const a1 = task('Aushub Baugrube Verwaltung', 'Erdbau', 8, [box('Baugrube Verwaltung', 'Aushub', 'Erdbau', [-1, -3.5, -1], [31, 0, 17])], ['v-erd']);
  a1.fix = start;
  const a2 = task('Aushub Halle Abschnitt 1', 'Erdbau', 5, [box('Aushub Halle Abschnitt 1', 'Aushub', 'Erdbau', [31, -0.6, -1], [60, 0, 25])], ['v-erd'], [P(a1)]);
  const a3 = task('Aushub Halle Abschnitt 2', 'Erdbau', 5, [box('Aushub Halle Abschnitt 2', 'Aushub', 'Erdbau', [60, -0.6, -1], [91, 0, 25])], ['v-erd'], [P(a2)]);

  // Verwaltungsgebäude, 3 Geschosse
  const ST = [{ k: 'UG', y0: -3.0, h: 3.0 }, { k: 'EG', y0: 0, h: 3.2 }, { k: '1.OG', y0: 3.2, h: 3.2 }];
  const T = 0.3, slab = 0.25, L = 30, W = 16;
  const bp = task('Bodenplatte Verwaltung BA 1–4', 'UG', 8, [0, 1, 2, 3].map(i => box(`UG · Bodenplatte BA ${i + 1}`, 'Bodenplatte', 'UG', [i * 7.5, -3.3, 0], [(i + 1) * 7.5, -3.0, W])), ['v-beton', 'v-bew'], [P(a1)], 'verw');
  let prev = bp;
  ST.forEach((s, si) => {
    const y0 = s.y0, yw = s.y0 + s.h - slab, aw = [];
    ['Süd', 'Nord'].forEach((side, k) => [0, 1, 2].forEach(i => aw.push(box(`${s.k} · Außenwand ${side} ${i + 1}`, 'Außenwand', s.k, [i * 10, y0, k ? W - T : 0], [(i + 1) * 10, yw, k ? W : T]))));
    aw.push(box(`${s.k} · Außenwand West`, 'Außenwand', s.k, [0, y0, T], [T, yw, W - T]));
    aw.push(box(`${s.k} · Außenwand Ost`, 'Außenwand', s.k, [L - T, y0, T], [L, yw, W - T]));
    const tAw = task(`${s.k} · Außenwände`, s.k, si === 0 ? 8 : 7, aw, si ? ['v-beton', 'v-bew', 'v-ger'] : ['v-beton', 'v-bew'], [P(prev)], 'verw');
    const iw = [
      box(`${s.k} · Treppenhauswand Ost`, 'Innenwand', s.k, [4.0, y0, T], [4.24, yw, 6.2]),
      box(`${s.k} · Treppenhauswand Nord`, 'Innenwand', s.k, [T, y0, 6.0], [4.0, yw, 6.24]),
      box(`${s.k} · Flurwand`, 'Innenwand', s.k, [8, y0, 9.0], [L - T, yw, 9.24]),
      ...[8, 15, 22].map((x, i) => box(`${s.k} · Stütze S${i + 1}`, 'Stütze', s.k, [x - .15, y0, 4.35], [x + .15, yw, 4.65]))
    ];
    const tIw = task(`${s.k} · Innenwände & Stützen`, s.k, 5, iw, ['v-beton', 'v-bew'], [P(tAw)], 'verw');
    const tTr = task(`${s.k} · Treppe`, s.k, 2, [stair(s.k, y0, s.h)], ['v-ft'], [P(tIw)], 'verw');
    prev = task(`Decke über ${s.k}`, s.k, 7, [0, 1, 2].map(i => box(`${s.k} · Decke Abschnitt ${i + 1}`, 'Decke', s.k, [i * 10, yw, 0], [(i + 1) * 10, s.y0 + s.h, W])), ['v-beton', 'v-bew'], [P(tTr)], 'verw');
  });
  const top = 6.4;
  const at = task('Attika Verwaltung', 'Dach', 3, [
    box('Dach · Attika Süd', 'Attika', 'Dach', [0, top, 0], [L, top + .5, .2]),
    box('Dach · Attika Nord', 'Attika', 'Dach', [0, top, W - .2], [L, top + .5, W]),
    box('Dach · Attika West', 'Attika', 'Dach', [0, top, .2], [.2, top + .5, W - .2]),
    box('Dach · Attika Ost', 'Attika', 'Dach', [L - .2, top, .2], [L, top + .5, W - .2])
  ], ['v-beton', 'v-bew', 'v-abd'], [P(prev)], 'verw');

  // Halle 60 × 24 m, zwei Abschnitte à 30 m; Fundamente laufen hinter dem Aushub her
  const HW = 24, HH = 8;
  const frames = [[30.5, 37.5, 45, 52.5], [60, 67.5, 75, 82.5, 89.5]];
  const fundT = [], halle = [];
  [0, 1].forEach(h => {
    const S = `Halle ${h + 1}`, x0 = 30 + h * 30, x1 = x0 + 30, xs = frames[h];
    const fu = [], co = [], bi = [], wa = [], so = [];
    xs.forEach((x, i) => [0.25, HW - 0.25].forEach((z, k) => {
      const lab = `${S} · Achse ${h * 4 + i + 1}${k ? 'B' : 'A'}`;
      fu.push(box(`${lab} Köcherfundament`, 'Fundament', S, [x - 1, -1.2, z - 1], [x + 1, -0.2, z + 1]));
      co.push(box(`${lab} Stütze`, 'Stütze', S, [x - .25, 0, z - .25], [x + .25, HH, z + .25]));
    }));

Terminrechnung des Tools:
- "dur" = Dauer in Arbeitstagen (Mo–Fr).
- "preds" = Vorgänger als Liste {"id","typ","lag"}. typ "EA" = Ende-Anfang (beginnt am Arbeitstag nach dem Ende des Vorgängers), "AA" = Anfang-Anfang (beginnt mit dem Vorgänger). "lag" in Arbeitstagen, negativ = Überlappung.

- Beginn und Ende rechnet das Tool selbst. Setze nie Beginn/Ende, sondern dur, preds und fix.
- Vorgänge mit Bauteilen nie löschen. Keine Zirkelbezüge. Bereits fertige Vorgänge (Ist 100 %) nur ändern, wenn ausdrücklich verlangt.

Antworte nur mit JSON in dieser Form:
{"antwort":"Kurze Erklärung auf Deutsch (höchstens 4 Sätze): was du änderst und was das für die Termine bedeutet.",
 "ops":[
  {"op":"update","id":"t5","dur":6,"preds":[{"id":"t4","typ":"EA","lag":0}],"fix":null,"name":"neuer Name"},
  {"op":"add","name":"Puffer Witterung","storey":"Halle 1","dur":5,"preds":[{"id":"t20","typ":"EA","lag":0}]},
  {"op":"delete","id":"t31"},
  {"op":"projektstart","date":"2026-08-03"}

Bei "update" nur die Felder angeben, die sich ändern; "preds" ersetzt die Liste vollständig. Ist die Anweisung unklar, frage in "antwort" nach und gib "ops":[] zurück.

Heute: ${TODAY}. Projektstart: ${S.projectStart}.
Aktueller Terminplan (id | Name | Abschnitt | Dauer | Soll | Vorgänger | frühestens | Ist-Stand | Bauteile):
${scheduleText()}`;
}
const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

    } else if (o.op === 'add') {

      tasks.push({ id, name: String(o.name || 'Neuer Vorgang').slice(0, 80), storey: String(o.storey || ''), dur: Math.max(1, Math.round(+o.dur) || 1), preds: cleanPreds(o.preds, id), fix: okDate(o.fix) ? o.fix : null, vergaben: [], start: null, end: null });
    } else if (o.op === 'delete') {
      const id = String(o.id);
      if (elsArr().some(e => e.taskId === id)) { notes.push(`„${taskMap[id]?.name || id}“ hat Bauteile und bleibt bestehen.`); continue; }

    else if (o.start !== t.start || o.end !== t.end || o.name !== t.name) diff.push({ name: t.name, a0: o.start, b0: o.end, a: t.start, b: t.end, d: D.wdBetween(o.end < t.end ? o.end : t.end, o.end < t.end ? t.end : o.end) * (t.end >= o.end ? 1 : -1) });

  try {

    const antwort = String(res?.antwort || '').trim() || 'Ich habe keine Erklärung mitgeschickt.';
    const ops = Array.isArray(res?.ops) ? res.ops : [];

function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Skript nicht ladbar')); document.head.append(s); }); }
const CAT = { IFCFOOTING: 'Fundamente', IFCWALL: 'Wände', IFCWALLSTANDARDCASE: 'Wände', IFCCOLUMN: 'Stützen', IFCBEAM: 'Unterzüge', IFCSLAB: 'Decken', IFCROOF: 'Dach', IFCSTAIR: 'Treppen', IFCSTAIRFLIGHT: 'Treppen', IFCRAMP: 'Treppen', IFCRAMPFLIGHT: 'Treppen', IFCWINDOW: 'Ausbau', IFCDOOR: 'Ausbau', IFCRAILING: 'Ausbau', IFCCURTAINWALL: 'Ausbau', IFCPLATE: 'Ausbau', IFCMEMBER: 'Sonstige', IFCBUILDINGELEMENTPROXY: 'Sonstige', IFCCOVERING: 'Ausbau', IFCPILE: 'Fundamente' };

async function loadIFC(file) {
  stopPlay(); cloudLeave();
  try {
    const { elements, geoms, order } = await parseIFC(await file.arrayBuffer(), file.name);
    lastIfcFile = file;
    const saved = loadSaved();
    let next;
    if (saved && saved.source === 'ifc' && saved.file === file.name) {
      next = saved; next.storeys = order;
      for (const g in elements) if (saved.elements[g]) Object.assign(elements[g], { taskId: saved.elements[g].taskId, startDate: saved.elements[g].startDate, doneDate: saved.elements[g].doneDate, acceptDate: saved.elements[g].acceptDate });
      next.elements = elements;
      toast('Gespeicherter Stand zu diesem Modell wiederhergestellt.');
    } else next = autoPlan(elements, order, file.name);
    S = next; reindex(); showModel(geoms);
    afterModelChange(); frame(); save();
    toast(CL.ready ? `${geoms.length} Bauteile geladen. Unter „Projekte“ kannst du das Modell fürs Team freigeben.` : `${geoms.length} Bauteile in ${order.length} Geschossen geladen.`, 4500);
  } catch (err) {
    console.error(err);
    toast('IFC konnte nicht gelesen werden: ' + (err.message || err), 6000);

}
function autoPlan(elements, order, fileName) {
  const vergaben = [
    { id: 'v-erd', gewerk: 'Erdarbeiten & Baugrube', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-beton', gewerk: 'Transportbeton', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-bew', gewerk: 'Bewehrung liefern & verlegen', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-ger', gewerk: 'Gerüst', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-ft', gewerk: 'Fertigteile / Treppen', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-aus', gewerk: 'Fenster, Türen, Ausbau', nu: '', summe: 0, status: 0, datum: null }
  ];
  const groups = [['Fundamente & Bodenplatte', ['Fundamente', 'Bodenplatte'], ['v-erd', 'v-beton', 'v-bew']], ['Wände & Stützen', ['Wände', 'Stützen'], ['v-beton', 'v-bew', 'v-ger']], ['Unterzüge', ['Unterzüge'], ['v-beton', 'v-bew']], ['Treppen', ['Treppen'], ['v-ft']], ['Decken & Dach', ['Decken', 'Dach'], ['v-beton', 'v-bew']], ['Sonstige Bauteile', ['Sonstige'], []]];
  const tasks = []; let start = TODAY; while (D.isWE(start)) start = D.add(start, 1);
  const els = Object.values(elements); let prev = null;
  const add = (name, storey, dur, g, vg) => {
    const t = { id: 't' + (tasks.length + 1), name, storey, dur, preds: prev ? [{ id: prev.id, typ: 'EA', lag: 0 }] : [], fix: prev ? null : start, vergaben: vg, start: null, end: null };
    g.forEach(e => e.taskId = t.id); tasks.push(t); prev = t;
  };
  order.forEach((st, si) => groups.forEach(([n, cats, vg]) => {
    const g = els.filter(e => e.storey === st && cats.includes(e.cat)); if (!g.length) return;
    const vol = g.reduce((a, e) => a + e.vol, 0);
    add(`${st} · ${n}`, st, Math.max(2, Math.min(12, Math.ceil(vol / 25))), g, si === 0 ? vg.filter(v => v !== 'v-ger') : vg);
  }));
  const aus = els.filter(e => e.cat === 'Ausbau');
  if (aus.length) add('Fenster, Türen, Ausbau', order[order.length - 1], 10, aus, ['v-aus']);
  schedule(tasks, start);
  const ms = [];
  if (els.some(e => e.cat === 'Bodenplatte')) ms.push({ name: 'Bodenplatte betoniert', cat: 'Bodenplatte' });
  order.forEach(s => ms.push({ name: `Rohbau ${s}`, storey: s }));
  ms.push({ name: 'Richtfest – Rohbau fertig', all: true });
  return { v: 2, source: 'ifc', file: fileName, project: { name: fileName.replace(/\.ifc$/i, '') }, projectStart: start, storeys: order, elements, tasks, vergaben, maengel: [], tagebuch: [], milestones: ms };
}

const LPS_GRUND = ['Planung / Info fehlt', 'Material nicht da', 'Personal fehlt', 'Gerät fehlt / defekt', 'Vorleistung nicht fertig', 'Witterung', 'Überplant / zu knapp', 'Änderung durch AG', 'Sonstiges'];

const lpsView = { tab: 'woche', week: D.monday(TODAY), open: false, drag: null, hide: new Set(), q: '', sel: null, cf: 'offen', collapsed: new Set(), qt: null, split: false, assign: null, msel: new Set(), undo: [], noClick: false };

function crewFor(t) {
  if (t.crew) return t.crew;
  const x = crewGuess(t);
  return !S?.lps?.crews || S.lps.crews.includes(x) ? x : S.lps.crews[0] || x;
}
function crewGuess(t) {
  const n = t.name;
  if (/aushub|baugrube|erd/i.test(n)) return 'NU Erdbau';
  if (/treppe|stützen|binder|sockel/i.test(n) && /halle|treppe/i.test(n)) return 'NU Fertigteilmontage';
  if (/halle/i.test(n)) return 'Kolonne Halle';
  return 'Kolonne Verwaltung';
}
function weekDays(mon) { return [0, 1, 2, 3, 4].map(i => D.add(mon, i)); }
function taskSpanInWeek(t, mon) {
  const ds = weekDays(mon), idx = ds.map((d, i) => (t.start <= d && d <= t.end ? i : -1)).filter(i => i >= 0);
  return idx.length ? { day: idx[0], len: idx[idx.length - 1] - idx[0] + 1 } : null;
}
function lpsSeed(tasks, elements) {
  const r = rng(7), crews = ['NU Erdbau', 'Kolonne Verwaltung', 'Kolonne Halle', 'NU Fertigteilmontage', 'NU Bewehrung'];
  const commits = [], constraints = [];
  const thisMon = D.monday(TODAY);
  // sieben abgeschlossene Wochen mit Zusagen und Abweichungen, dazu die laufende Woche
  const plan = { '-7': ['Personal fehlt'], '-6': [], '-5': ['Gerät fehlt / defekt', 'Witterung'], '-4': ['Vorleistung nicht fertig'], '-3': [], '-2': ['Witterung', 'Material nicht da'], '-1': ['Planung / Info fehlt'] };
  const today = (D.parse(TODAY).getUTCDay() + 6) % 7;
  const steps = t => /aushub/i.test(t.name) ? ['Aushub und Abfuhr', 'Planum und Verbau', 'Aushub Restflächen']
    : /stützen|binder|sockel|treppe/i.test(t.name) && /halle|treppe/i.test(t.name) ? ['Montage', 'Ausrichten und Vergießen']
    : /fundament/i.test(t.name) ? ['Sauberkeitsschicht und Schalung', 'Betonieren Köcher']
    : ['Schalen', 'Betonieren', 'Ausschalen und Umsetzen'];
  for (let w = -7; w <= 0; w++) {
    const mon = D.add(thisMon, 7 * w), miss = [...(plan[w] || [])], wk = [];
    for (const t of tasks) {
      const sp = taskSpanInWeek(t, mon); if (!sp) continue;
      const st = steps(t);
      for (let d = sp.day, i = 0; d < sp.day + sp.len; d += 2, i++) {
        const len = Math.min(2, sp.day + sp.len - d);
        wk.push({ id: uid(), week: mon, taskId: t.id, text: `${t.name} · ${st[i % st.length]}`, crew: crewFor(t), day: d, len, status: 'offen', grund: '', notiz: '' });
      }
      if (/^Decke|Bodenplatte/.test(t.name)) wk.push({ id: uid(), week: mon, taskId: t.id, text: `Bewehrung ${t.name}`, crew: 'NU Bewehrung', day: sp.day, len: Math.min(3, sp.len), status: 'offen', grund: '', notiz: '' });
    }
    for (const c of wk) {
      if (w < 0) c.status = 'erledigt';
      else if (c.day + c.len - 1 < today) c.status = 'erledigt';
    }
    if (w < 0) miss.forEach(g => { const pool = wk.filter(c => c.status === 'erledigt'); if (pool.length > 1) { const c = pool[Math.floor(r() * pool.length)]; c.status = 'nicht'; c.grund = g; } });
    commits.push(...wk);
  }
  const byName = n => tasks.find(t => t.name === n);
  const C = (n, kat, text, wer, bis, erledigt = false) => { const t = byName(n); if (t) constraints.push({ id: uid(), taskId: t.id, kat, text, wer, bis: bis || D.addWD(t.start, -3), erledigt }); };
  C('Decke über EG', 'Planung / Info', 'Bewehrungsplan Abschnitt 3, Index b', 'Tragwerksplanung', D.addWD(TODAY, 2));
  C('Decke über EG', 'Material', 'Deckenschalung 2. Satz abrufen', 'Polier', D.addWD(TODAY, 1), true);
  C('1.OG · Außenwände', 'Gerät', 'Fassadengerüst beauftragen und stellen', 'Bauleitung', D.addWD(TODAY, 4));
  C('1.OG · Außenwände', 'Planung / Info', 'Aussparungsplan HLS freigegeben', 'TGA-Planer', D.addWD(TODAY, 5), true);
  C('1.OG · Treppe', 'Material', 'Fertigteiltreppen bestellen (Lieferzeit 4 Wochen)', 'Einkauf', D.addWD(TODAY, -1));
  C('Halle 1 · Stützen', 'Material', 'Fertigteile Halle beauftragen', 'Bauleitung', D.addWD(TODAY, 8));
  C('Halle 1 · Stützen', 'Platz / Zugang', 'Kranstandort und Zufahrt Mobilkran festlegen', 'Polier', null);
  C('Fundamente Halle 2', 'Genehmigung / Abnahme', 'Bodengutachter: Abnahme Gründungssohle Achse 6', 'Bodengutachter', D.addWD(TODAY, 3));
  C('Attika Verwaltung', 'Planung / Info', 'Detail Abdichtungsanschluss Attika klären', 'Architekt', null);
  return { crews, commits, constraints };
}

function taskDone(t) { const ti = taskIst(t, TODAY); return ti.els.length ? !!ti.finish : t.end < TODAY; }
function ppc(mon) {
  const k = lpsK().filter(c => c.week === mon), done = k.filter(c => c.status === 'erledigt').length, nicht = k.filter(c => c.status === 'nicht').length;
  return { n: k.length, done, nicht, offen: k.length - done - nicht, p: done + nicht ? done / (done + nicht) : null };
}
