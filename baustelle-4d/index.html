<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="../assets/icons/favicon-32.png">
<title>Baustelle 4D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* Layout: Leitstand — 3D-Viewport links mit Zeitleiste, rechts Bauleitungs-Panel mit Reitern; auf dem Handy untereinander */
:root{
  --bg:#e9ecee; --panel:#fbfcfc; --raise:#f1f3f4; --fg:#191d20; --muted:#5a646b; --line:#d3d9dc;
  --viewport:#d9dfe2; --grid:#b9c1c6;
  --brand:#ff0000; --accent:#d10a0a; --accent-fg:#ffffff;
  --st-ghost:#8d979e; --st-arbeit:#e0951a; --st-fertig:#3a9459; --st-abgenommen:#2a78ad;
  --st-verzug:#e04a2b; --st-vorsprung:#6a5acd; --st-beton:#9aa0a5;
  --v0:#b4434b; --v1:#e0951a; --v2:#2a78ad; --v3:#3a9459; --mangel:#c2187a; --erde:#8a6a3f;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --panel:#191d21; --raise:#21262b; --fg:#e6e9eb; --muted:#97a1a8; --line:#2c3338;
  --viewport:#0f1214; --grid:#2b3238; --accent:#ff3b30; --accent-fg:#ffffff;
  --st-ghost:#7d878e; --st-arbeit:#f0a72c; --st-fertig:#4cb36f; --st-abgenommen:#4a9bd4;
  --st-verzug:#ff6a48; --st-vorsprung:#9488ee; --st-beton:#7f868c;
  --v0:#e0606a; --v1:#f0a72c; --v2:#4a9bd4; --v3:#4cb36f; --mangel:#e84aa6; --erde:#a7865a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#191d21; --raise:#21262b; --fg:#e6e9eb; --muted:#97a1a8; --line:#2c3338;
  --viewport:#0f1214; --grid:#2b3238; --accent:#ff3b30; --accent-fg:#ffffff;
  --st-ghost:#7d878e; --st-arbeit:#f0a72c; --st-fertig:#4cb36f; --st-abgenommen:#4a9bd4;
  --st-verzug:#ff6a48; --st-vorsprung:#9488ee; --st-beton:#7f868c;
  --v0:#e0606a; --v1:#f0a72c; --v2:#4a9bd4; --v3:#4cb36f; --mangel:#e84aa6; --erde:#a7865a; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;background:var(--brand);display:grid;place-items:center;color:#fff;font:700 13px/1 var(--f-display);letter-spacing:.04em;flex:none}
.brand h1{font:700 19px/1 var(--f-display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.proj{display:flex;flex-direction:column;min-width:0}
.proj input{border:0;background:transparent;padding:0;font-weight:600;font-size:13px;min-width:0;width:22ch}
.proj small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.score{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.meter{width:180px}
.meter .bar{position:relative;height:8px;background:var(--raise);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;display:block}
.meter .bar .soll{background:repeating-linear-gradient(135deg,var(--st-ghost) 0 3px,transparent 3px 6px);opacity:.55}
.meter .bar .ist{background:var(--st-fertig)}
.meter .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.meter .lab b{color:var(--fg);font-weight:600}
.level{font:600 13px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.level b{color:var(--accent)}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raise);padding:6px 11px;border-radius:var(--r);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

main.work{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:var(--viewport);display:grid;grid-template-rows:1fr auto}
#view{position:relative;min-height:0;overflow:hidden}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.tools>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.seg select{border:0;background:transparent;font-size:12.5px;padding:4px 6px}
.brushes{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px 6px}
.brushes button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.brushes button[aria-pressed="true"]{border-color:var(--fg)}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.dot.ghost{background:transparent;border:1.5px dashed var(--st-ghost)}
.hint{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:12px;max-width:300px}
.banner{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:10px 18px;border-radius:var(--r);text-align:center;pointer-events:none;box-shadow:0 8px 30px rgb(0 0 0 / .25);transition:opacity .4s,transform .4s;max-width:calc(100% - 32px)}
.banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.banner strong{font:700 22px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.banner.off{opacity:0;transform:translate(-50%,-10px)}
.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--accent)}
.cross::before{left:6px;top:0;width:2px;height:14px}.cross::after{top:6px;left:0;height:2px;width:14px}

.timeline{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 12px;display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 14px;align-items:center}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.play svg{width:16px;height:16px;fill:currentColor}
.when{min-width:170px}
.when strong{display:block;font:700 22px/1 var(--f-display);letter-spacing:.02em}
.when span{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.track{position:relative;min-width:0;padding-top:12px}
.track input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ticks{position:absolute;left:8px;right:8px;top:0;height:12px}
.ticks i{position:absolute;top:0;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:var(--st-fertig);border:1px solid var(--panel)}
.ticks i.open{background:var(--panel);border-color:var(--st-ghost)}
.ticks b{position:absolute;top:-2px;width:2px;height:13px;margin-left:-1px;background:var(--accent)}
.tl-right{display:flex;gap:6px;align-items:center}

aside.panel{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:11px 11px 9px;font:600 13.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .cnt{font:500 10.5px/1 var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:1px 5px;margin-left:3px;vertical-align:1px}
.pane{overflow:auto;padding:14px 16px 28px;min-height:0;display:flex;flex-direction:column;gap:16px}
.pane h2{font:700 15px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.pane h3{font:600 17px/1.2 var(--f-display);margin:0;text-wrap:balance}
.sect{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.statusrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.statusrow button{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:7px 4px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px}
.statusrow button[aria-pressed="true"]{border-color:var(--fg);background:var(--panel);box-shadow:inset 0 0 0 1px var(--fg)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;background:var(--panel)}
.row:first-child{border-top:0}
.row.click{cursor:pointer}.row.click:hover{background:var(--raise)}
.row .t{font-weight:500;min-width:0}
.row .s{grid-column:1/-1;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;line-height:1.4}
.warn{display:grid;grid-template-columns:4px minmax(0,1fr);gap:0 10px;padding:8px 10px 8px 0;font-size:13px;border-top:1px solid var(--line)}
.warn:first-child{border-top:0}
.warn::before{content:"";background:var(--c,var(--st-verzug));border-radius:0 2px 2px 0}
.warn small{display:block;color:var(--muted);font-size:12px}
.lvl{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.lvl .bar{height:10px;background:var(--raise);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.lvl .bar i{position:absolute;inset:0 auto 0 0;background:var(--st-fertig)}
.lvl .bar u{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--fg);opacity:.6}
.ms{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.ms:first-child{border-top:0}
.ms .d{width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--st-ghost);margin-left:3px}
.ms.done .d{background:var(--st-fertig);border-color:var(--st-fertig)}
.gantt{font-size:12.5px}
.grow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow.sel .gname{color:var(--accent)}
.ghead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gname{font-weight:600;cursor:pointer;min-width:0}
.gbar{position:relative;height:12px;background:var(--raise);border-radius:2px}
.gbar .p{position:absolute;top:2px;bottom:2px;border:1px solid var(--st-ghost);border-radius:2px;background:var(--panel)}
.gbar .p i{position:absolute;inset:0 auto 0 0;background:var(--st-fertig);opacity:.85}
.gbar .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.gedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gedit input[type=date]{font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font-size:13.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.form .full{grid-column:1/-1}
.form .act{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .sum{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.card details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.card label.ck{display:flex;gap:6px;font-size:12.5px;align-items:center;padding:2px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
table.tab{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.tab th,table.tab td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tab th:first-child,table.tab td:first-child{text-align:left;white-space:normal}
table.tab th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
table.tab tfoot td{font-weight:600;border-bottom:0}
.tw{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:13px;text-align:center}
.note{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 11px;border-radius:10px;font-size:13.5px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--panel);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--raise);border:1px solid var(--line);border-bottom-left-radius:3px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .btn{white-space:normal;text-align:left}
.prop{border-color:var(--fg)}

.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal textarea{width:100%;min-height:160px;font:12px/1.4 var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:8px}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--viewport) 70%,transparent);z-index:5;font:600 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:var(--r);font-size:13px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main.work{grid-template-columns:minmax(0,1fr)}
  .stage{height:68vh;min-height:420px}
  aside.panel{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .score{margin-left:0}
  .meter{width:140px}
  .timeline{grid-template-columns:auto 1fr auto}
  .timeline .track{grid-column:1/-1;order:5}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.banner{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">4D</div><h1>Baustelle 4D</h1></div>
    <div class="proj">
      <small id="projSrc">Beispieldaten</small>
      <input id="projName" aria-label="Projektname" value="Demo-Rohbau Bürogebäude">
    </div>
    <div class="score">
      <div class="level" id="levelChip" title="Aktuelle Bauebene">Ebene –</div>
      <div class="meter" title="Fortschritt nach Betonvolumen">
        <div class="bar"><i class="soll" id="mSoll"></i><i class="ist" id="mIst"></i></div>
        <div class="lab"><span>Ist <b id="mIstT" class="num">0 %</b></span><span>Soll <b id="mSollT" class="num">0 %</b></span></div>
      </div>
      <div class="hdr-actions">
        <label class="btn primary" for="ifcFile">IFC laden</label>
        <input type="file" id="ifcFile" accept=".ifc" hidden>
        <button class="btn" id="btnDemo">Demo</button>
        <button class="btn" id="btnData">Daten</button>
      </div>
    </div>
  </header>

  <main class="work">
    <section class="stage">
      <div id="view">
        <div class="tools">
          <div class="seg" role="group" aria-label="Ansicht" id="modeSeg">
            <button data-mode="ist" aria-pressed="true">Ist</button>
            <button data-mode="soll" aria-pressed="false">Soll</button>
            <button data-mode="vergleich" aria-pressed="false">Soll/Ist</button>
            <button data-mode="vergabe" aria-pressed="false">Vergabe</button>
          </div>
          <div class="seg" role="group" aria-label="Werkzeug" id="toolSeg">
            <button data-tool="select" aria-pressed="true">Auswahl</button>
            <button data-tool="paint" aria-pressed="false">Malen</button>
            <button data-tool="walk" aria-pressed="false">Begehung</button>
          </div>
          <div class="brushes" id="brushes" hidden aria-label="Status zum Malen"></div>
          <div class="seg"><select id="storeyFilter" aria-label="Geschosse anzeigen"></select></div>
        </div>
        <div class="cross" id="cross" hidden></div>
        <div class="legend" id="legend"></div>
        <div class="hint" id="hint">Klick wählt ein Bauteil, Shift-Klick mehrere. Ziehen dreht, rechte Maustaste verschiebt.</div>
        <div class="banner off" id="banner" aria-live="polite"><small>Meilenstein erreicht</small><strong id="bannerT"></strong></div>
        <div class="busy" id="busy" hidden>IFC wird gelesen …</div>
      </div>
      <div class="timeline">
        <button class="play" id="play" aria-label="Bauablauf abspielen"><svg viewBox="0 0 16 16" id="playIco"><path d="M3 1.5v13l11-6.5z"/></svg></button>
        <div class="when"><strong class="num" id="whenD">–</strong><span id="whenK">–</span></div>
        <div class="track">
          <div class="ticks" id="ticks"></div>
          <input type="range" id="slider" min="0" max="100" value="0" aria-label="Stichtag">
        </div>
        <div class="tl-right">
          <button class="btn small" id="btnToday">Heute</button>
          <select class="btn small" id="speed" aria-label="Abspielgeschwindigkeit"><option value="220">1×</option><option value="90" selected>2×</option><option value="35">5×</option></select>
        </div>
      </div>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

function istAt(e, d) {
  if (e.acceptDate && e.acceptDate <= d) return 3;
  if (e.doneDate && e.doneDate <= d) return 2;
  if (e.startDate && e.startDate <= d) return 1;
  return 0;
}

  if (!e.doneDate || e.doneDate > d) e.doneDate = d;
  e.acceptDate = d;
}

}

/* ---------- Terminrechnung ---------- */
// Vorgang: dur (AT), preds [{id, typ: 'EA'|'AA', lag}], fix = frühester Start
function schedule(tasks, p0) {

function frame() {

function applyColors() {
  const d = view.date;
  const order = S.storeys;
  const lim = view.storey === 'alle' ? Infinity : order.indexOf(view.storey);
  for (const [g, m] of meshes) {
    const e = S.elements[g]; if (!e) { m.visible = false; continue; }
    const si = order.indexOf(e.storey);
    const sel = view.sel.has(g);
    let key = colorKey(e, d);
    if (e.cat === 'Aushub') { if (key === 'ghost') key = 'erde'; else if (['fertig', 'abgenommen', 'beton'].includes(key)) key = null; }
    m.visible = (si < 0 || si <= lim) && !!key;
    if (!key) continue;
    m.material = MAT[key + (sel ? '|s' : '')];
    if (m.userData.edges) m.userData.edges.material = sel ? edgeSelMat : edgeMat;

  // Mängel-Pins

  const pinGeo = applyColors.geo ||= new THREE.ConeGeometry(.28, .8, 4).rotateX(Math.PI);

    const mesh = meshes.get(m.guid); if (!mesh || !mesh.visible) continue;
    const b = new THREE.Box3().setFromObject(mesh);
    const p = new THREE.Mesh(pinGeo, pinMat); p.position.set((b.min.x + b.max.x) / 2, b.max.y + .7, (b.min.z + b.max.z) / 2);

}

let lastT = performance.now();
function loop(t) {

/* Auswahl & Malen */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  ray.setFromCamera(ndc, camera);

  return hits[0]?.object.userData.guid || null;
}
let down = null, painting = false, painted = new Set();
renderer.domElement.addEventListener('pointerdown', ev => {
  if (view.tool === 'walk') return;
  down = { x: ev.clientX, y: ev.clientY };
  if (view.tool === 'paint' && ev.button === 0) { painting = true; painted.clear(); paintAt(ev); }
});
renderer.domElement.addEventListener('pointermove', ev => { if (painting) paintAt(ev); });
addEventListener('pointerup', ev => {
  if (painting) { painting = false; if (painted.size) { const n = painted.size; checkMilestones(true); save(); renderAll(); toast(`${n} Bauteil${n > 1 ? 'e' : ''} auf „${STATUS[view.brush].label}“ gesetzt (Stichtag ${D.de(view.date)})`); } down = null; return; }

/* ---------- Zeitleiste ---------- */
let range = { a: TODAY, b: TODAY };
function computeRange() {
  const ds = S.tasks.flatMap(t => [t.start, t.end]).sort();
  range = { a: D.add(ds[0] || TODAY, -3), b: D.add(ds[ds.length - 1] || TODAY, 7) };
  if (TODAY < range.a) range.a = TODAY; if (TODAY > range.b) range.b = TODAY;
  $('#slider').max = D.diff(range.a, range.b);
}
function setDate(d, fromPlay = false) {
  const prev = view.date;
  view.date = d < range.a ? range.a : d > range.b ? range.b : d;
  $('#slider').value = D.diff(range.a, view.date);
  $('#whenD').textContent = `${D.wd(view.date)} ${D.de(view.date)}`;
  const delta = D.diff(TODAY, view.date);
  $('#whenK').textContent = `KW ${D.kw(view.date)} · ${delta === 0 ? 'heute' : delta > 0 ? `in ${delta} Tagen` : `vor ${-delta} Tagen`}`;
  if (fromPlay) milestoneCrossing(prev, view.date);
  applyColors(); renderHeader();
  if (!fromPlay || view.tab === 'uebersicht' || view.tab === 'termine') renderPanel();
  if (view.tool === 'paint') setTool('paint');
}

  $('#ticks').innerHTML = milestoneStates().map(m => `<i class="${m.done ? '' : 'open'}" style="left:${pos(m.done || m.soll)}" title="${esc(m.name)}"></i>`).join('') + `<b style="left:${pos(TODAY)}" title="Heute"></b>`;
}
$('#slider').addEventListener('input', e => { stopPlay(); setDate(D.add(range.a, +e.target.value)); });
$('#btnToday').addEventListener('click', () => { stopPlay(); setDate(TODAY); });
let playH = null;
function stopPlay() { clearInterval(playH); playH = null; $('#playIco').innerHTML = '<path d="M3 1.5v13l11-6.5z"/>'; $('#play').setAttribute('aria-label', 'Bauablauf abspielen'); }
$('#play').addEventListener('click', () => {

function msFilter(m) { return m.all ? () => true : m.cat ? e => e.cat === m.cat : m.storeys ? e => m.storeys.includes(e.storey) : e => e.storey === m.storey; }
function milestoneStates() {
  return (S.milestones || []).map(m => {
    const els = elsArr().filter(msFilter(m)); if (!els.length) return null;
    const allDone = els.every(e => e.doneDate);
    const done = allDone ? els.map(e => e.doneDate).sort().pop() : null;
    const soll = els.map(e => taskMap[e.taskId]?.end || '').sort().pop();
    return { name: m.name, done, soll, els };
  }).filter(Boolean);
}
function milestoneCrossing(a, b) {

  if (hit) showBanner(hit.name);
}
let knownDone = null;

  const st = milestoneStates(), cur = new Set(st.filter(m => m.done && m.done <= view.date).map(m => m.name));
  if (announce && knownDone) for (const n of cur) if (!knownDone.has(n)) { showBanner(n); break; }
  knownDone = cur; renderTicks();
}

function taskIst(t, d = view.date) {
  const els = elsArr().filter(e => e.taskId === t.id);
  const tv = els.reduce((a, e) => a + (e.vol || .01), 0), dv = els.reduce((a, e) => a + (istAt(e, d) >= 2 ? (e.vol || .01) : 0), 0);
  return { els, p: tv ? dv / tv : 0, finish: els.length && els.every(e => e.doneDate && e.doneDate <= d) ? els.map(e => e.doneDate).sort().pop() : null };
}
function warnings() {
  const d = view.date, W = [];
  for (const t of S.tasks) {
    const ti = taskIst(t);
    if (!ti.els.length) continue;
    if (t.end < d && !ti.finish) W.push({ c: '--st-verzug', t: `${t.name}: ${D.wdBetween(t.end, d)} AT Verzug`, s: `Soll-Ende ${D.de(t.end)} · ${Math.round(ti.p * 100)} % fertig`, task: t.id });
    else if (t.start < d && ti.p === 0 && !ti.els.some(e => istAt(e, d) >= 1)) W.push({ c: '--st-verzug', t: `${t.name}: Start überfällig`, s: `Soll-Beginn ${D.de(t.start)}`, task: t.id });
    const ahead = D.wdBetween(d, t.start);
    if (t.start >= d && ahead <= 15) {
      const miss = (t.vergaben || []).map(id => vergMap[id]).filter(v => v && v.status < 3);
      if (miss.length) W.push({ c: '--v1', t: `${t.name} startet in ${ahead} AT`, s: `Noch nicht beauftragt: ${miss.map(v => v.gewerk).join(', ')}`, task: t.id });
    }
  }
  for (const m of S.maengel) if (m.status === 'offen' && m.frist && m.frist < d) W.push({ c: '--mangel', t: `${MTYP[m.typ]} überfällig: ${m.titel}`, s: `Frist ${D.de(m.frist)} · ${m.wer || '–'}`, guid: m.guid });
  return W;
}
function pUebersicht() {
  const p = progressAt(view.date), W = warnings(), ms = milestoneStates();
  const vz = elsArr().filter(e => Math.min(istAt(e, view.date), 2) < sollAt(e, view.date)).length;
  return `
  <div class="sect"><h2>Stand ${D.de(view.date)}</h2>
    <dl class="kv num">
      <dt>Fortschritt Ist</dt><dd><b>${fmtN(p.ist * 100, 0)} %</b> von ${fmtN(p.tot, 0)} m³ Beton</dd>
      <dt>Fortschritt Soll</dt><dd>${fmtN(p.soll * 100, 0)} % <span class="muted">(${p.ist >= p.soll ? '+' : '−'}${fmtN(Math.abs(p.ist - p.soll) * 100, 0)} Pkt.)</span></dd>
      <dt>Bauteile im Verzug</dt><dd>${vz}</dd>
      <dt>Offene Punkte</dt><dd>${S.maengel.filter(m => m.status === 'offen').length}</dd>
    </dl></div>
  <div class="sect"><h2>Achtung</h2>

      if ('fix' in o) t.fix = okDate(o.fix) ? o.fix : null;
      if (o.name) t.name = String(o.name).slice(0, 80);
    } else if (o.op === 'add') {

      tasks.push({ id, name: String(o.name || 'Neuer Vorgang').slice(0, 80), storey: String(o.storey || ''), dur: Math.max(1, Math.round(+o.dur) || 1), preds: cleanPreds(o.preds, id), fix: okDate(o.fix) ? o.fix : null, vergaben: [], start: null, end: null });
    } else if (o.op === 'delete') {
      const id = String(o.id);
      if (elsArr().some(e => e.taskId === id)) { notes.push(`„${taskMap[id]?.name || id}“ hat Bauteile und bleibt bestehen.`); continue; }

    if (!o) diff.push({ name: t.name, neu: true, a: t.start, b: t.end });
    else if (o.start !== t.start || o.end !== t.end || o.name !== t.name) diff.push({ name: t.name, a0: o.start, b0: o.end, a: t.start, b: t.end, d: D.wdBetween(o.end < t.end ? o.end : t.end, o.end < t.end ? t.end : o.end) * (t.end >= o.end ? 1 : -1) });

function pAufmass() {
  const rows = {}, st = {};
  for (const e of elsArr()) {

    const s = st[e.storey] ||= { v: 0, f: 0 }; s.v += e.vol || 0; if (istAt(e, view.date) >= 2) s.f += e.vol || 0;
  }
  const tot = Object.values(rows).reduce((a, r) => ({ n: a.n + r.n, v: a.v + r.v, f: a.f + r.f }), { n: 0, v: 0, f: 0 });

    </tbody><tfoot><tr><td>Summe</td><td>${tot.n}</td><td>${fmtN(tot.v, 2)}</td><td>${fmtN(tot.f, 2)}</td><td>${fmtN(tot.v ? tot.f / tot.v * 100 : 0, 0)}</td></tr></tfoot></table></div></div>
    <div class="sect"><h2>Nach Geschoss</h2><div class="tw"><table class="tab"><thead><tr><th>Geschoss</th><th>Soll m³</th><th>Ist m³</th><th>offen m³</th></tr></thead><tbody>
    ${S.storeys.filter(s => st[s]).map(s => `<tr><td>${esc(s)}</td><td>${fmtN(st[s].v, 2)}</td><td>${fmtN(st[s].f, 2)}</td><td>${fmtN(st[s].v - st[s].f, 2)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Volumen aus der Modellgeometrie (geschlossene Körper), Aushub als Bodenvolumen. Grundlage für Abschlagsrechnung und Betonbestellung – vor Abrechnung gegen Pläne prüfen.</p></div>`;
}

function shrink(file) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
    const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .72)); };
    img.onerror = () => res(r.result); img.src = r.result; }; r.readAsDataURL(file); });
}

/* ---------- IFC-Import ---------- */
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Skript nicht ladbar')); document.head.append(s); }); }
const CAT = { IFCFOOTING: 'Fundamente', IFCWALL: 'Wände', IFCWALLSTANDARDCASE: 'Wände', IFCCOLUMN: 'Stützen', IFCBEAM: 'Unterzüge', IFCSLAB: 'Decken', IFCROOF: 'Dach', IFCSTAIR: 'Treppen', IFCSTAIRFLIGHT: 'Treppen', IFCRAMP: 'Treppen', IFCRAMPFLIGHT: 'Treppen', IFCWINDOW: 'Ausbau', IFCDOOR: 'Ausbau', IFCRAILING: 'Ausbau', IFCCURTAINWALL: 'Ausbau', IFCPLATE: 'Ausbau', IFCMEMBER: 'Sonstige', IFCBUILDINGELEMENTPROXY: 'Sonstige', IFCCOVERING: 'Ausbau', IFCPILE: 'Fundamente' };
const SKIP = new Set(['IFCSPACE', 'IFCOPENINGELEMENT', 'IFCSITE', 'IFCANNOTATION', 'IFCVIRTUALELEMENT', 'IFCBUILDING', 'IFCBUILDINGSTOREY', 'IFCFURNISHINGELEMENT', 'IFCFLOWTERMINAL', 'IFCFLOWSEGMENT', 'IFCFLOWFITTING']);
let ifcApi = null;
async function loadIFC(file) {
  stopPlay(); $('#busy').hidden = false; $('#busy').textContent = 'IFC-Leser wird geladen …';
  await new Promise(r => setTimeout(r, 30));
  try {
    if (!window.WebIFC) await loadScript('https://cdn.jsdelivr.net/npm/web-ifc@0.0.78/web-ifc-api-iife.js');
    if (!ifcApi) { ifcApi = new WebIFC.IfcAPI(); await ifcApi.Init(p => new URL(p, location.href).href, true); }
    $('#busy').textContent = `${file.name} wird gelesen …`; await new Promise(r => setTimeout(r, 30));
    const api = ifcApi, W = window.WebIFC;
    const mid = api.OpenModel(new Uint8Array(await file.arrayBuffer()), { COORDINATE_TO_ORIGIN: true });
    const stName = new Map(), storeyOf = new Map();
    const sts = api.GetLineIDsWithType(mid, W.IFCBUILDINGSTOREY);
    for (let i = 0; i < sts.size(); i++) { const s = api.GetLine(mid, sts.get(i)); stName.set(s.expressID, { name: s.Name?.value || `Geschoss ${i + 1}`, elev: +(s.Elevation?.value ?? i) }); }
    const rels = api.GetLineIDsWithType(mid, W.IFCRELCONTAINEDINSPATIALSTRUCTURE);
    for (let i = 0; i < rels.size(); i++) { const r = api.GetLine(mid, rels.get(i)); const st = r.RelatingStructure?.value; if (!stName.has(st)) continue; for (const e of r.RelatedElements || []) storeyOf.set(e.value, st); }
    // Bauteile in Aggregaten (z. B. Treppe -> Läufe) erben das Geschoss
    const agg = api.GetLineIDsWithType(mid, W.IFCRELAGGREGATES);
    for (let i = 0; i < agg.size(); i++) { const r = api.GetLine(mid, agg.get(i)); const p = r.RelatingObject?.value; if (storeyOf.has(p)) for (const e of r.RelatedObjects || []) if (!storeyOf.has(e.value)) storeyOf.set(e.value, storeyOf.get(p)); }
    const storeys = [...stName.values()].sort((a, b) => a.elev - b.elev);
    const uniq = []; storeys.forEach(s => { let n = s.name, k = 2; while (uniq.includes(n)) n = `${s.name} (${k++})`; s.name = n; uniq.push(n); });
    const elements = {}, geoms = [];
    const mat = new THREE.Matrix4(), nm = new THREE.Matrix3(), v3 = new THREE.Vector3();
    api.StreamAllMeshes(mid, mesh => {
      const id = mesh.expressID, line = api.GetLine(mid, id);
      const tname = api.GetNameFromTypeCode(line.type); const T = tname.toUpperCase();
      if (SKIP.has(T)) return;
      const pos = [], nor = [], idx = []; let base = 0;
      for (let j = 0; j < mesh.geometries.size(); j++) {
        const pg = mesh.geometries.get(j), g = api.GetGeometry(mid, pg.geometryExpressID);
        const v = api.GetVertexArray(g.GetVertexData(), g.GetVertexDataSize()), ix = api.GetIndexArray(g.GetIndexData(), g.GetIndexDataSize());
        mat.fromArray(pg.flatTransformation); nm.getNormalMatrix(mat);
        for (let i = 0; i < v.length; i += 6) { v3.set(v[i], v[i + 1], v[i + 2]).applyMatrix4(mat); pos.push(v3.x, v3.y, v3.z); v3.set(v[i + 3], v[i + 4], v[i + 5]).applyMatrix3(nm).normalize(); nor.push(v3.x, v3.y, v3.z); }
        for (let i = 0; i < ix.length; i++) idx.push(ix[i] + base);
        base += v.length / 6; g.delete();
      }
      if (!idx.length) return;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      geom.setIndex(idx);
      let vol = 0; const P = pos;
      for (let i = 0; i < idx.length; i += 3) { const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
        vol += (P[a] * (P[b + 1] * P[c + 2] - P[b + 2] * P[c + 1]) - P[a + 1] * (P[b] * P[c + 2] - P[b + 2] * P[c]) + P[a + 2] * (P[b] * P[c + 1] - P[b + 1] * P[c])) / 6; }
      const guid = line.GlobalId?.value || 'id' + id;
      const st = stName.get(storeyOf.get(id))?.name || 'Ohne Geschoss';
      let cat = CAT[T] || 'Sonstige';
      if (T === 'IFCSLAB' && (line.PredefinedType?.value === 'BASESLAB' || st === storeys[0]?.name && /boden|base|found|sohl/i.test(line.Name?.value || ''))) cat = 'Bodenplatte';
      elements[guid] = { guid, name: line.Name?.value || tname, type: tname, cat, storey: st, vol: Math.abs(vol), taskId: null, startDate: null, doneDate: null, acceptDate: null };
      geoms.push([guid, geom, idx.length < 60000]);
    });
    api.CloseModel(mid);
    if (!geoms.length) throw new Error('Keine Bauteile mit Geometrie gefunden.');
    const order = storeys.map(s => s.name); if (Object.values(elements).some(e => e.storey === 'Ohne Geschoss')) order.push('Ohne Geschoss');
    const saved = loadSaved();
    let next;
    if (saved && saved.source === 'ifc' && saved.file === file.name) {
      next = saved; next.storeys = order;
      for (const g in elements) if (saved.elements[g]) Object.assign(elements[g], { taskId: saved.elements[g].taskId, startDate: saved.elements[g].startDate, doneDate: saved.elements[g].doneDate, acceptDate: saved.elements[g].acceptDate });
      next.elements = elements;
      toast('Gespeicherter Stand zu diesem Modell wiederhergestellt.');
    } else next = autoPlan(elements, order, file.name);
    S = next; reindex();
    clearModel(); geoms.forEach(([g, geo, edges]) => addMesh(g, geo, edges && geoms.length < 4000));
    afterModelChange(); frame();
    toast(`${geoms.length} Bauteile in ${order.length} Geschossen geladen.`);
  } catch (err) {
    console.error(err);
    toast('IFC konnte nicht gelesen werden: ' + (err.message || err), 6000);
  } finally { $('#busy').hidden = true; }
}
function autoPlan(elements, order, fileName) {
  const vergaben = [
    { id: 'v-erd', gewerk: 'Erdarbeiten & Baugrube', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-beton', gewerk: 'Transportbeton', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-bew', gewerk: 'Bewehrung liefern & verlegen', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-ger', gewerk: 'Gerüst', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-ft', gewerk: 'Fertigteile / Treppen', nu: '', summe: 0, status: 0, datum: null },
    { id: 'v-aus', gewerk: 'Fenster, Türen, Ausbau', nu: '', summe: 0, status: 0, datum: null }
  ];
  const groups = [['Fundamente & Bodenplatte', ['Fundamente', 'Bodenplatte'], ['v-erd', 'v-beton', 'v-bew']], ['Wände & Stützen', ['Wände', 'Stützen'], ['v-beton', 'v-bew', 'v-ger']], ['Unterzüge', ['Unterzüge'], ['v-beton', 'v-bew']], ['Treppen', ['Treppen'], ['v-ft']], ['Decken & Dach', ['Decken', 'Dach'], ['v-beton', 'v-bew']], ['Sonstige Bauteile', ['Sonstige'], []]];
  const tasks = []; let start = TODAY; while (D.isWE(start)) start = D.add(start, 1);
  const els = Object.values(elements); let prev = null;
  const add = (name, storey, dur, g, vg) => {
    const t = { id: 't' + (tasks.length + 1), name, storey, dur, preds: prev ? [{ id: prev.id, typ: 'EA', lag: 0 }] : [], fix: prev ? null : start, vergaben: vg, start: null, end: null };
    g.forEach(e => e.taskId = t.id); tasks.push(t); prev = t;
  };
  order.forEach((st, si) => groups.forEach(([n, cats, vg]) => {
    const g = els.filter(e => e.storey === st && cats.includes(e.cat)); if (!g.length) return;
    const vol = g.reduce((a, e) => a + e.vol, 0);
    add(`${st} · ${n}`, st, Math.max(2, Math.min(12, Math.ceil(vol / 25))), g, si === 0 ? vg.filter(v => v !== 'v-ger') : vg);
  }));
  const aus = els.filter(e => e.cat === 'Ausbau');
  if (aus.length) add('Fenster, Türen, Ausbau', order[order.length - 1], 10, aus, ['v-aus']);
  schedule(tasks, start);
  const ms = [];
  if (els.some(e => e.cat === 'Bodenplatte')) ms.push({ name: 'Bodenplatte betoniert', cat: 'Bodenplatte' });
  order.forEach(s => ms.push({ name: `Rohbau ${s}`, storey: s }));
  ms.push({ name: 'Richtfest – Rohbau fertig', all: true });
  return { v: 2, source: 'ifc', file: fileName, project: { name: fileName.replace(/\.ifc$/i, '') }, projectStart: start, storeys: order, elements, tasks, vergaben, maengel: [], tagebuch: [], milestones: ms };
}

function afterModelChange() {
  view.sel.clear(); view.selTask = null; view.storey = 'alle';
  computeRange(); buildMaterials(); renderStoreyFilter(); renderLegend(); renderBrushes();
  knownDone = null; checkMilestones(false);
  setDate(view.date >= range.a && view.date <= range.b ? view.date : TODAY);
  renderAll();
}
function startDemo(state) {
  const demo = buildDemo(); SPECS = demo.specs;
  S = state && state.source === 'demo' && state.v === 2 ? state : demo.S;
  // Geometrie-GUIDs sind deterministisch, aber bei anderem Startdatum gespeicherter Stand → frische Demo
  if (!SPECS.every(s => S.elements[s.guid])) S = demo.S;
  reindex(); buildDemoMeshes(SPECS); view.date = TODAY; afterModelChange(); frame();
}
const saved = loadSaved();
if (saved && saved.source === 'ifc') {
  startDemo();
  toast(`Gespeicherter Stand zu „${saved.file}“ vorhanden – die IFC-Datei erneut laden, um weiterzumachen.`, 6000);
} else startDemo(saved);

const themeObs = () => { buildMaterials(); applyColors(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeObs);
new MutationObserver(themeObs).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
resize(); requestAnimationFrame(loop);
</script>
